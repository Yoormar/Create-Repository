<style>
/* =========================================================
   GRÁFICO DE EVOLUCIÓN DIARIA
========================================================= */

.panel-diario-global {
  overflow: hidden;
}

.cabecera-evolucion-ui {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.cabecera-evolucion-ui h3 {
  margin: 0 0 5px;
  font-size: 17px;
}

.cabecera-evolucion-ui p {
  margin: 0;
  color: #667085;
  font-size: 12px;
}

.resumen-picos-ui {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.tarjeta-pico-ui {
  min-width: 125px;
  padding: 9px 12px;
  border: 1px solid #d8dee8;
  border-radius: 10px;
  background: #f8fafc;
}

.tarjeta-pico-ui span {
  display: block;
  margin-bottom: 3px;
  color: #667085;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.tarjeta-pico-ui strong {
  color: #101828;
  font-size: 16px;
}

.leyenda-evolucion-ui {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 9px;
  font-size: 12px;
  font-weight: 700;
}

.leyenda-evolucion-item-ui {
  display: flex;
  align-items: center;
  gap: 6px;
}

.leyenda-evolucion-color-ui {
  width: 20px;
  height: 4px;
  border-radius: 999px;
}

.color-ingresados-ui {
  background: #2563eb;
}

.color-atendidos-ui {
  background: #16a34a;
}

.contenedor-grafico-picos-ui {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 4px;
}

.grafico-picos-ui {
  display: block;
  min-width: 100%;
  height: 330px;
}

.linea-ingresados-ui {
  fill: none;
  stroke: #2563eb;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.linea-atendidos-ui {
  fill: none;
  stroke: #16a34a;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.area-atendidos-ui {
  fill: url(#degradadoAtendidosUI);
  opacity: 0.25;
}

.punto-ingresado-ui {
  fill: #ffffff;
  stroke: #2563eb;
  stroke-width: 3;
}

.punto-atendido-ui {
  fill: #ffffff;
  stroke: #16a34a;
  stroke-width: 3;
}

.linea-cuadricula-ui {
  stroke: #e4e7ec;
  stroke-width: 1;
}

.texto-eje-ui {
  fill: #667085;
  font-size: 11px;
  font-family: Arial, sans-serif;
}

.valor-punto-ui {
  fill: #344054;
  font-size: 10px;
  font-weight: 700;
  font-family: Arial, sans-serif;
}

.sin-datos-grafico-ui {
  padding: 35px 15px;
  border: 1px dashed #d0d5dd;
  border-radius: 10px;
  color: #667085;
  text-align: center;
  font-weight: 700;
}


/* =========================================================
   CAMPUS AL FINAL
========================================================= */

.panel-campus-dashboard {
  width: 100%;
  margin-top: 14px;
}


/* =========================================================
   MENSAJE DE CAMPOS OBLIGATORIOS
========================================================= */

.alerta-guardado-v3-ui {
  margin-bottom: 12px;
  padding: 11px 14px;
  border: 2px solid #f04438;
  border-radius: 9px;
  background: #fff1f0;
  color: #b42318;
  font-size: 14px;
  font-weight: 800;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {
  .resumen-picos-ui {
    width: 100%;
  }

  .tarjeta-pico-ui {
    flex: 1;
  }
}
</style>


<script>
(function () {
  'use strict';

  if (
    window.__AJUSTE_CIERRE_DASHBOARD_V3__
  ) {
    return;
  }

  window.__AJUSTE_CIERRE_DASHBOARD_V3__ =
    true;


  /* =======================================================
     UTILIDADES
  ======================================================= */

  function elementoV3(id) {
    return document.getElementById(id);
  }


  function normalizarV3(valor) {
    if (
      typeof normalizarCliente ===
      'function'
    ) {
      return normalizarCliente(valor);
    }

    return String(valor || '')
      .normalize('NFD')
      .replace(
        /[\u0300-\u036f]/g,
        ''
      )
      .trim()
      .toUpperCase();
  }


  function esAdministradorV3() {
    return normalizarV3(
      estado?.sesion?.rol
    ) === 'ADMIN';
  }


  function valorVacioV3(valor) {
    const texto =
      normalizarV3(valor);

    return (
      !texto ||
      texto === 'SELECCIONAR' ||
      texto === '#N/D' ||
      texto === 'N/D' ||
      texto === '-'
    );
  }


  function escaparV3(valor) {
    if (
      typeof escapeHtml ===
      'function'
    ) {
      return escapeHtml(
        String(valor || '')
      );
    }

    return String(valor || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  /* =======================================================
     VALIDACIÓN DEL ASESOR
  ======================================================= */

  function obtenerFaltantesV3() {
    const faltantes = [];

    if (
      valorVacioV3(
        elementoV3(
          'editCampus'
        )?.value
      )
    ) {
      faltantes.push(
        'Campus'
      );
    }

    if (
      valorVacioV3(
        elementoV3(
          'editTipoIngreso'
        )?.value
      )
    ) {
      faltantes.push(
        'Tipo de ingreso'
      );
    }

    if (
      valorVacioV3(
        elementoV3(
          'editTipoConvalidacion'
        )?.value
      )
    ) {
      faltantes.push(
        'Tipo de convalidación'
      );
    }

    if (
      normalizarV3(
        estado.ticketActual
          ?.tipoTicket
      ) === 'REEVALUADO' &&
      valorVacioV3(
        elementoV3(
          'editTipoReevaluacion'
        )?.value
      )
    ) {
      faltantes.push(
        'Tipo de reevaluación'
      );
    }

    return faltantes;
  }


  function mostrarAlertaGuardadoV3(
    faltantes
  ) {
    const cuerpo =
      document.querySelector(
        '#modalTicket .modal-body'
      );

    if (!cuerpo) {
      return;
    }

    let alerta =
      elementoV3(
        'alertaGuardadoV3'
      );

    if (!alerta) {
      alerta =
        document.createElement(
          'div'
        );

      alerta.id =
        'alertaGuardadoV3';

      alerta.className =
        'alerta-guardado-v3-ui';

      cuerpo.prepend(
        alerta
      );
    }

    alerta.innerHTML = `
      Completa los datos obligatorios:
      ${faltantes
        .map(escaparV3)
        .join(', ')}.
    `;
  }


  function ocultarAlertaGuardadoV3() {
    elementoV3(
      'alertaGuardadoV3'
    )?.remove();
  }


  /* =======================================================
     GUARDAR TICKET
  ======================================================= */

  window.guardarTicketActual =
    function () {
      if (
        !estado.ticketActual
      ) {
        return;
      }

      const datos =
        recopilarEdicionTicket();

      /*
       * La validación solo se aplica al asesor.
       * El administrador puede guardar incompleto.
       */
      if (!esAdministradorV3()) {
        const faltantes =
          obtenerFaltantesV3();

        if (faltantes.length) {
          mostrarAlertaGuardadoV3(
            faltantes
          );

          mostrarMensaje(
            'mensajeTicket',
            'Completa los datos obligatorios antes de guardar.'
          );

          return;
        }
      }

      ocultarAlertaGuardadoV3();

      const boton =
        elementoV3(
          'botonGuardarTicket'
        );

      if (boton) {
        boton.disabled = true;
        boton.textContent =
          'Guardando...';
      }

      mostrarMensaje(
        'mensajeTicket',
        'Guardando cambios...',
        'ok'
      );

      google.script.run
        .withSuccessHandler(
          resultado => {
            if (boton) {
              boton.disabled = false;
              boton.textContent =
                'Guardar cambios';
            }

            if (
              !resultado ||
              !resultado.ok
            ) {
              mostrarMensaje(
                'mensajeTicket',
                resultado?.message ||
                'No se pudo guardar el ticket'
              );

              return;
            }

            if (resultado.ticket) {
              estado.ticketActual =
                resultado.ticket;
            }

            mostrarMensaje(
              'mensajeTicket',
              resultado.message ||
              'Ticket actualizado correctamente',
              'ok'
            );

            /*
             * Recarga la información de la hoja.
             */
            cargarTickets();

            if (
              esAdministradorV3() &&
              estado.vistaActual ===
                'dashboard'
            ) {
              cargarDashboardAdmin();
            }

            window.setTimeout(
              cerrarModalTicket,
              750
            );
          }
        )
        .withFailureHandler(
          error => {
            if (boton) {
              boton.disabled = false;
              boton.textContent =
                'Guardar cambios';
            }

            mostrarMensaje(
              'mensajeTicket',
              error?.message ||
              'Error al guardar el ticket'
            );
          }
        )
        .guardarTicketFinalHoraV3(
          estado.token,
          datos
        );
    };


  /* =======================================================
     FECHAS DEL GRÁFICO
  ======================================================= */

  function valorFechaV3(texto) {
    const partes =
      String(texto || '')
        .split('/');

    if (partes.length !== 3) {
      return 0;
    }

    return new Date(
      Number(partes[2]),
      Number(partes[1]) - 1,
      Number(partes[0])
    ).getTime();
  }


  function fechaCortaV3(texto) {
    const partes =
      String(texto || '')
        .split('/');

    if (partes.length < 2) {
      return texto || '';
    }

    return `${partes[0]}/${partes[1]}`;
  }


  /* =======================================================
     GRÁFICO DE PICOS
  ======================================================= */

  function crearGraficoPicosV3(
    filas
  ) {
    const lista =
      (filas || [])
        .map(
          fila => ({
            fecha:
              fila.fecha || '',

            ingresados:
              Number(
                fila.totalIngresado ||
                0
              ),

            atendidos:
              Number(
                fila.totalAtendido ||
                0
              )
          })
        )
        .sort(
          (
            a,
            b
          ) =>
            valorFechaV3(a.fecha) -
            valorFechaV3(b.fecha)
        );

    if (!lista.length) {
      return `
        <div class="sin-datos-grafico-ui">
          No hay información para el periodo seleccionado.
        </div>
      `;
    }

    const picoIngreso =
      lista.reduce(
        (
          maximo,
          fila
        ) =>
          fila.ingresados >
          maximo.ingresados
            ? fila
            : maximo,
        lista[0]
      );

    const picoAtendido =
      lista.reduce(
        (
          maximo,
          fila
        ) =>
          fila.atendidos >
          maximo.atendidos
            ? fila
            : maximo,
        lista[0]
      );

    const ancho =
      Math.max(
        820,
        lista.length * 78
      );

    const alto = 320;

    const margen = {
      izquierda: 52,
      derecha: 25,
      superior: 28,
      inferior: 55
    };

    const anchoGrafico =
      ancho -
      margen.izquierda -
      margen.derecha;

    const altoGrafico =
      alto -
      margen.superior -
      margen.inferior;

    const maximoValor =
      Math.max(
        1,
        ...lista.map(
          fila =>
            Math.max(
              fila.ingresados,
              fila.atendidos
            )
        )
      );

    const maximoEscala =
      Math.ceil(
        maximoValor / 10
      ) * 10 || 10;

    function posicionX(
      indice
    ) {
      if (lista.length === 1) {
        return (
          margen.izquierda +
          anchoGrafico / 2
        );
      }

      return (
        margen.izquierda +
        (
          indice /
          (lista.length - 1)
        ) *
        anchoGrafico
      );
    }


    function posicionY(valor) {
      return (
        margen.superior +
        altoGrafico -
        (
          Number(valor || 0) /
          maximoEscala
        ) *
        altoGrafico
      );
    }


    function crearRuta(
      campo
    ) {
      return lista
        .map(
          (
            fila,
            indice
          ) =>
            `${
              indice === 0
                ? 'M'
                : 'L'
            } ${
              posicionX(indice)
            } ${
              posicionY(
                fila[campo]
              )
            }`
        )
        .join(' ');
    }


    const rutaIngresados =
      crearRuta(
        'ingresados'
      );

    const rutaAtendidos =
      crearRuta(
        'atendidos'
      );

    const rutaAreaAtendidos =
      `${rutaAtendidos}
       L ${
         posicionX(
           lista.length - 1
         )
       } ${
         margen.superior +
         altoGrafico
       }
       L ${
         posicionX(0)
       } ${
         margen.superior +
         altoGrafico
       } Z`;

    const cantidadLineas = 5;

    const cuadricula =
      Array
        .from(
          {
            length:
              cantidadLineas + 1
          },
          (
            _,
            indice
          ) => {
            const valor =
              (
                maximoEscala /
                cantidadLineas
              ) *
              (
                cantidadLineas -
                indice
              );

            const y =
              margen.superior +
              (
                indice /
                cantidadLineas
              ) *
              altoGrafico;

            return `
              <line
                class="linea-cuadricula-ui"
                x1="${margen.izquierda}"
                y1="${y}"
                x2="${
                  ancho -
                  margen.derecha
                }"
                y2="${y}"
              ></line>

              <text
                class="texto-eje-ui"
                x="${
                  margen.izquierda -
                  10
                }"
                y="${y + 4}"
                text-anchor="end"
              >
                ${Math.round(valor)}
              </text>
            `;
          }
        )
        .join('');

    const etiquetas =
      lista
        .map(
          (
            fila,
            indice
          ) => `
            <text
              class="texto-eje-ui"
              x="${posicionX(indice)}"
              y="${
                alto -
                margen.inferior +
                25
              }"
              text-anchor="middle"
            >
              ${
                escaparV3(
                  fechaCortaV3(
                    fila.fecha
                  )
                )
              }
            </text>
          `
        )
        .join('');

    const puntosIngresados =
      lista
        .map(
          (
            fila,
            indice
          ) => `
            <circle
              class="punto-ingresado-ui"
              cx="${posicionX(indice)}"
              cy="${
                posicionY(
                  fila.ingresados
                )
              }"
              r="5"
            >
              <title>
                ${
                  escaparV3(
                    fila.fecha
                  )
                } · Ingresados:
                ${fila.ingresados}
              </title>
            </circle>

            <text
              class="valor-punto-ui"
              x="${posicionX(indice)}"
              y="${
                posicionY(
                  fila.ingresados
                ) - 10
              }"
              text-anchor="middle"
            >
              ${fila.ingresados}
            </text>
          `
        )
        .join('');

    const puntosAtendidos =
      lista
        .map(
          (
            fila,
            indice
          ) => `
            <circle
              class="punto-atendido-ui"
              cx="${posicionX(indice)}"
              cy="${
                posicionY(
                  fila.atendidos
                )
              }"
              r="5"
            >
              <title>
                ${
                  escaparV3(
                    fila.fecha
                  )
                } · Atendidos:
                ${fila.atendidos}
              </title>
            </circle>
          `
        )
        .join('');

    return `
      <div class="cabecera-evolucion-ui">
        <div>
          <h3>
            Evolución diaria de tickets
          </h3>

          <p>
            Comparación de tickets ingresados y atendidos por día.
          </p>
        </div>

        <div class="resumen-picos-ui">
          <div class="tarjeta-pico-ui">
            <span>
              Pico de ingreso
            </span>

            <strong>
              ${picoIngreso.ingresados}
              ·
              ${
                escaparV3(
                  fechaCortaV3(
                    picoIngreso.fecha
                  )
                )
              }
            </strong>
          </div>

          <div class="tarjeta-pico-ui">
            <span>
              Pico de atención
            </span>

            <strong>
              ${picoAtendido.atendidos}
              ·
              ${
                escaparV3(
                  fechaCortaV3(
                    picoAtendido.fecha
                  )
                )
              }
            </strong>
          </div>
        </div>
      </div>

      <div class="leyenda-evolucion-ui">
        <div class="leyenda-evolucion-item-ui">
          <span
            class="leyenda-evolucion-color-ui color-ingresados-ui"
          ></span>

          Tickets ingresados
        </div>

        <div class="leyenda-evolucion-item-ui">
          <span
            class="leyenda-evolucion-color-ui color-atendidos-ui"
          ></span>

          Tickets atendidos
        </div>
      </div>

      <div class="contenedor-grafico-picos-ui">
        <svg
          class="grafico-picos-ui"
          viewBox="0 0 ${ancho} ${alto}"
          style="width:${ancho}px"
          role="img"
          aria-label="Evolución diaria de tickets"
        >
          <defs>
            <linearGradient
              id="degradadoAtendidosUI"
              x1="0"
              y1="0"
              x2="0"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="#16a34a"
                stop-opacity="0.45"
              ></stop>

              <stop
                offset="100%"
                stop-color="#16a34a"
                stop-opacity="0"
              ></stop>
            </linearGradient>
          </defs>

          ${cuadricula}

          <path
            class="area-atendidos-ui"
            d="${rutaAreaAtendidos}"
          ></path>

          <path
            class="linea-ingresados-ui"
            d="${rutaIngresados}"
          ></path>

          <path
            class="linea-atendidos-ui"
            d="${rutaAtendidos}"
          ></path>

          ${puntosIngresados}
          ${puntosAtendidos}
          ${etiquetas}
        </svg>
      </div>
    `;
  }


  function pintarGraficoPicosV3(
    filas
  ) {
    const panel =
      document.querySelector(
        '.panel-diario-global'
      );

    if (!panel) {
      return;
    }

    panel.innerHTML =
      crearGraficoPicosV3(
        filas
      );
  }


  /* =======================================================
     ORDEN FINAL DEL DASHBOARD
  ======================================================= */

  function ordenarDashboardV3() {
    const campus =
      document.querySelector(
        '.panel-campus-dashboard'
      );

    const gridInferior =
      document.querySelector(
        '.dashboard-grid-inferior'
      );

    /*
     * El orden final queda:
     *
     * 1. Evolución diaria
     * 2. Atención diaria y Ranking global
     * 3. Tickets por campus
     */
    if (
      campus &&
      gridInferior &&
      gridInferior
        .nextElementSibling !==
        campus
    ) {
      gridInferior
        .insertAdjacentElement(
          'afterend',
          campus
        );
    }
  }


  /* =======================================================
     INTERCEPTAR PINTADO DEL DASHBOARD
  ======================================================= */

  const pintarDashboardAnteriorV3 =
    window.pintarDashboard;

  if (
    typeof pintarDashboardAnteriorV3 ===
    'function'
  ) {
    window.pintarDashboard =
      function (datos) {
        const resultado =
          pintarDashboardAnteriorV3
            .apply(
              this,
              arguments
            );

        window.setTimeout(
          () => {
            pintarGraficoPicosV3(
              datos?.diario ||
              estado.diarioDashboard ||
              []
            );

            ordenarDashboardV3();
          },
          0
        );

        return resultado;
      };
  }


  document.addEventListener(
    'DOMContentLoaded',
    () => {
      ordenarDashboardV3();
    }
  );
})();
</script>

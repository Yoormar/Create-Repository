      background: #fff7ed;

    @media (max-width: 700px) {

      .dg-usuario-sistema {

      }

      .dg-contenido-principal {

  </style>

  <!-- =====================================================
       ESTADO COMPARTIDO CON EL DASHBOARD
  ====================================================== -->

  <script>
    var estado = {
      token: '',
      sesion: null
    };

    window.estado = estado;
  </script>


  <!-- FUNCIONES EXCLUSIVAS DEL DASHBOARD GERENCIAL -->

  <?!= incluir('DashboardGerencialUI'); ?>


  <!-- =====================================================
       INICIO DE SESIÓN Y CIERRE
  ====================================================== -->

  <script>
    (() => {
      'use strict';

      function elemento(id) {
        return document.getElementById(id);
      }


      function mostrarMensaje(
        mensaje,
        esError = true
      ) {
        const contenedor =
          elemento(
            'mensajeLoginGerencial'
          );

        if (!contenedor) {
          return;
        }

        contenedor.textContent =
          mensaje || '';

        contenedor.classList.toggle(
          'mensaje-error',
          Boolean(esError)
        );

        contenedor.classList.toggle(
          'mensaje-ok',
          !esError
        );
      }


      function bloquearIngreso(
        bloqueado
      ) {
        const boton =
          elemento(
            'botonIngresarGerencial'
          );

        const selector =
          elemento(
            'usuarioGerencial'
          );

        if (boton) {
          boton.disabled =
            Boolean(bloqueado);

          boton.textContent =
            bloqueado
              ? 'PROCESANDO...'
              : 'INGRESAR';
        }

        if (selector) {
          selector.disabled =
            Boolean(bloqueado);
        }
      }


      function cargarAdministradores() {
        const selector =
          elemento(
            'usuarioGerencial'
          );

        const boton =
          elemento(
            'botonIngresarGerencial'
          );

        if (!selector || !boton) {
          return;
        }

        selector.disabled = true;
        boton.disabled = true;

        google.script.run
          .withSuccessHandler(
            usuarios => {
              const administradores =
                (
                  Array.isArray(usuarios)
                    ? usuarios
                    : []
                ).filter(
                  usuario =>
                    String(
                      usuario.rol || ''
                    )
                      .trim()
                      .toUpperCase() ===
                    'ADMIN'
                );

              selector.innerHTML = `
                <option value="">
                  Selecciona un administrador
                </option>
              `;

              administradores.forEach(
                administrador => {
                  const opcion =
                    document.createElement(
                      'option'
                    );

                  opcion.value =
                    administrador.usuario;

                  opcion.textContent =
                    administrador.nombre
                      ? `${administrador.nombre} · Administrador`
                      : administrador.usuario;

                  selector.appendChild(
                    opcion
                  );
                }
              );

              if (
                !administradores.length
              ) {
                selector.innerHTML = `
                  <option value="">
                    No existen administradores activos
                  </option>
                `;

                mostrarMensaje(
                  'No se encontró ningún administrador activo.'
                );

                return;
              }

              selector.disabled = false;
              boton.disabled = false;

              mostrarMensaje(
                '',
                false
              );
            }
          )
          .withFailureHandler(
            error => {
              selector.innerHTML = `
                <option value="">
                  Error al cargar administradores
                </option>
              `;

              mostrarMensaje(
                error?.message ||
                'No se pudieron cargar los administradores.'
              );
            }
          )
          .obtenerUsuariosActivos();
      }


      function mostrarDashboard(
        sesion
      ) {
        elemento(
          'paginaLoginGerencial'
        )?.classList.add(
          'oculto'
        );

        elemento(
          'paginaSistemaGerencial'
        )?.classList.remove(
          'oculto'
        );

        elemento(
          'vistaDashboardGerencial'
        )?.classList.remove(
          'oculto'
        );

        const nombre =
          elemento(
            'nombreSesionGerencial'
          );

        const rol =
          elemento(
            'rolSesionGerencial'
          );

        if (nombre) {
          nombre.textContent =
            sesion.nombre ||
            sesion.usuario ||
            'Administrador';
        }

        if (rol) {
          rol.textContent =
            'ADMIN';
        }

        elemento(
          'avisoClaveGerencial'
        )?.classList.toggle(
          'activo',
          Boolean(
            sesion.debeCambiarClave
          )
        );

        if (
          typeof window
            .inicializarDashboardGerencial ===
          'function'
        ) {
          window
            .inicializarDashboardGerencial();
        }

        if (
          typeof window
            .cargarDashboardGerencial ===
          'function'
        ) {
          window
            .cargarDashboardGerencial(
              false
            );
        }
      }


      function ingresarGerencial() {
        const usuario =
          elemento(
            'usuarioGerencial'
          )?.value || '';

        const clave =
          elemento(
            'claveGerencial'
          )?.value || '';

        if (!usuario) {
          mostrarMensaje(
            'Selecciona un administrador.'
          );

          return;
        }

        bloquearIngreso(true);
        mostrarMensaje('', false);

        google.script.run
          .withSuccessHandler(
            resultado => {
              bloquearIngreso(false);

              if (
                !resultado ||
                !resultado.ok
              ) {
                mostrarMensaje(
                  resultado?.message ||
                  'No se pudo iniciar sesión.'
                );

                return;
              }

              if (
                String(
                  resultado.rol || ''
                )
                  .trim()
                  .toUpperCase() !==
                'ADMIN'
              ) {
                if (resultado.token) {
                  google.script.run
                    .cerrarSesion(
                      resultado.token
                    );
                }

                mostrarMensaje(
                  'Acceso exclusivo para administradores.'
                );

                return;
              }

              estado.token =
                resultado.token;

              estado.sesion =
                resultado;

              window.estado =
                estado;

              sessionStorage.setItem(
                'ticketTokenGerencial',
                resultado.token
              );

              mostrarDashboard(
                resultado
              );
            }
          )
          .withFailureHandler(
            error => {
              bloquearIngreso(false);

              mostrarMensaje(
                error?.message ||
                'Ocurrió un error al iniciar sesión.'
              );
            }
          )
          .iniciarSesion({
            usuario:
              usuario,

            clave:
              clave
          });
      }


      function salirGerencial() {
        const token =
          estado.token;

        estado.token = '';
        estado.sesion = null;

        sessionStorage.removeItem(
          'ticketTokenGerencial'
        );

        if (
          typeof window
            .limpiarDashboardGerencial ===
          'function'
        ) {
          window
            .limpiarDashboardGerencial();
        }

        elemento(
          'vistaDashboardGerencial'
        )?.classList.add(
          'oculto'
        );

        elemento(
          'paginaSistemaGerencial'
        )?.classList.add(
          'oculto'
        );

        elemento(
          'paginaLoginGerencial'
        )?.classList.remove(
          'oculto'
        );

        const clave =
          elemento(
            'claveGerencial'
          );

        if (clave) {
          clave.value = '';
        }

        mostrarMensaje('', false);

        if (token) {
          google.script.run
            .cerrarSesion(token);
        }
      }


      function inicializarPaginaGerencial() {
        elemento(
          'botonIngresarGerencial'
        )?.addEventListener(
          'click',
          ingresarGerencial
        );

        elemento(
          'botonSalirGerencial'
        )?.addEventListener(
          'click',
          salirGerencial
        );

        elemento(
          'claveGerencial'
        )?.addEventListener(
          'keydown',
          evento => {
            if (
              evento.key ===
              'Enter'
            ) {
              ingresarGerencial();
            }
          }
        );

        cargarAdministradores();
      }


      if (
        document.readyState ===
        'loading'
      ) {
        document.addEventListener(
          'DOMContentLoaded',
          inicializarPaginaGerencial
        );

      } else {
        inicializarPaginaGerencial();
      }
    })();
  </script>

</body>
</html>

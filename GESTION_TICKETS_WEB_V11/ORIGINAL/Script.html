<script>
const estado = {
  usuariosLogin: [],
  token: '',
  sesion: null,
  tickets: [],
  listas: null,
  ticketActual: null,
  permisosTicket: null,
  dashboard: null,
  vistaActual: 'bandeja',

  panelesAbiertos: {
    'EN REVISION': true,
    'PENDIENTE': true,
    'EN ESPERA': true,
    'SEGUIMIENTO': true,
    'DERIVADO': false,
    'ATENDIDO': false,
    'CERRADO': false
  },

  alertasDatos: [],
  alertasPortal: [],
  calendarioLaboral: [],
  pendientesAsignacionZendesk: [],

  temporizadorInactividad: null,
  ultimoMovimiento: Date.now(),

  vistaDashboardActual: 'global',
  diarioDashboard: [],
  ordenAtencionDiaria: 'fecha_desc',

  alertasDatosAbiertas: false,
  responsablesAlertasAbiertos: {}
};


const $ = id =>
  document.getElementById(id);


function escapeHtml(valor) {
  return String(valor ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function normalizarCliente(valor) {
  return String(valor ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .toUpperCase();
}


function esVerdadero(valor) {
  if (
    valor === true ||
    valor === 1
  ) {
    return true;
  }

  return [
    'SI',
    'SÍ',
    'TRUE',
    '1',
    'ACTIVO',
    'LABORABLE'
  ].includes(
    normalizarCliente(valor)
  );
}


function setText(id, valor) {
  const elemento = $(id);

  if (elemento) {
    elemento.textContent =
      valor ?? '';
  }
}


function mostrarMensaje(
  id,
  texto,
  tipo = 'error'
) {
  const elemento = $(id);

  if (!elemento) {
    return;
  }

  elemento.textContent =
    texto || '';

  elemento.className =
    tipo === 'ok'
      ? 'mensaje mensaje-ok'
      : 'mensaje mensaje-error';
}


function llenarSelect(
  selectId,
  valores,
  seleccionado,
  incluirVacio = true
) {
  const select = $(selectId);

  if (!select) {
    return;
  }

  select.innerHTML =
    incluirVacio
      ? '<option value="">Seleccionar</option>'
      : '';

  (valores || []).forEach(
    valor => {
      const option =
        document.createElement(
          'option'
        );

      option.value =
        valor;

      option.textContent =
        valor;

      option.selected =
        String(valor) ===
        String(
          seleccionado || ''
        );

      select.appendChild(
        option
      );
    }
  );
}


function claseDetalle(detalle) {
  const d =
    normalizarCliente(
      detalle
    );

  if (d === 'EN REVISION') {
    return 'detalle-en-revision';
  }

  if (d === 'PENDIENTE') {
    return 'detalle-pendiente';
  }

  if (d === 'EN ESPERA') {
    return 'detalle-en-espera';
  }

  if (d === 'SEGUIMIENTO') {
    return 'detalle-seguimiento';
  }

  if (d === 'DERIVADO') {
    return 'detalle-derivado';
  }

  if (
    d === 'ATENDIDO' ||
    d === 'CERRADO'
  ) {
    return 'detalle-atendido';
  }

  return '';
}


function claseOrigen(origen) {
  return normalizarCliente(
    origen
  ) === 'PORTAL'
    ? 'origen-portal'
    : 'origen-zendesk';
}


function claseTipoTicket(
  tipoTicket
) {
  const tipo =
    normalizarCliente(
      tipoTicket
    );

  if (tipo === 'NUEVO') {
    return 'tipo-ticket-nuevo';
  }

  if (tipo === 'REEVALUADO') {
    return 'tipo-ticket-reevaluado';
  }

  if (tipo === 'REASIGNADO') {
    return 'tipo-ticket-reasignado';
  }

  return 'tipo-ticket-otro';
}


function htmlTipoTicket(
  tipoTicket
) {
  const texto =
    String(
      tipoTicket ||
      'Sin tipo'
    );

  return `
    <span
      class="tipo-ticket-badge ${claseTipoTicket(texto)}"
    >
      ${escapeHtml(texto)}
    </span>
  `;
}


function esTicketPortal(ticket) {
  return normalizarCliente(
    ticket?.origen
  ) === 'PORTAL';
}


function htmlIndicadorPortal(ticket) {
  if (esTicketPortal(ticket)) {
    return `
      <span
        class="check-ticket-portal activo"
        title="Tengo ticket Portal"
      >
        ✓
      </span>
    `;
  }

  return `
    <span
      class="check-ticket-portal inactivo"
      title="No es ticket Portal"
    >
      —
    </span>
  `;
}


function claseEstadoTicket(
  estadoTicket
) {
  return normalizarCliente(
    estadoTicket
  ) === 'CERRADO'
    ? 'estado-cerrado'
    : 'estado-pendiente';
}


/* =========================================================
   INICIO DE SESIÓN
========================================================= */

function cargarUsuariosLogin() {
  const boton =
    $('botonIngresar');

  if (boton) {
    boton.disabled = true;
  }

  google.script.run
    .withSuccessHandler(
      usuarios => {
        estado.usuariosLogin =
          Array.isArray(usuarios)
            ? usuarios
            : [];

        const select =
          $('usuario');

        if (select) {
          select.innerHTML =
            '<option value="">Selecciona tu usuario</option>';

          estado.usuariosLogin
            .forEach(usuario => {
              const opcion =
                document.createElement(
                  'option'
                );

              opcion.value =
                usuario.usuario;

              opcion.textContent =
                usuario.rol ===
                'ADMIN'
                  ? 'Administrador'
                  : `${usuario.usuario} - ${usuario.nombre}`;

              select.appendChild(
                opcion
              );
            });
        }

        if (boton) {
          boton.disabled = false;
        }
      }
    )
    .withFailureHandler(
      error => {
        if (boton) {
          boton.disabled = false;
        }

        mostrarMensaje(
          'mensajeLogin',
          error?.message ||
          'No se pudieron cargar los usuarios'
        );
      }
    )
    .obtenerUsuariosActivos();
}


function ingresar() {
  const usuario =
    $('usuario')?.value ||
    '';

  const clave =
    $('clave')?.value ||
    '';

  const boton =
    $('botonIngresar');

  if (!usuario) {
    mostrarMensaje(
      'mensajeLogin',
      'Selecciona un usuario'
    );

    return;
  }

  if (!clave) {
    mostrarMensaje(
      'mensajeLogin',
      'Ingresa tu clave'
    );

    return;
  }

  if (boton) {
    boton.disabled =
      true;

    boton.textContent =
      'INGRESANDO...';
  }

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (boton) {
          boton.disabled =
            false;

          boton.textContent =
            'INGRESAR';
        }

        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeLogin',
            resultado?.message ||
            'No se pudo iniciar sesión'
          );

          return;
        }

        estado.token =
          resultado.token;

        estado.sesion =
          resultado;

        sessionStorage.setItem(
          'ticketToken',
          resultado.token
        );

        mostrarSistema(
          resultado
        );

        if (
          resultado.debeCambiarClave
        ) {
          abrirModalClave(
            true
          );
        }
      }
    )
    .withFailureHandler(
      error => {
        if (boton) {
          boton.disabled =
            false;

          boton.textContent =
            'INGRESAR';
        }

        mostrarMensaje(
          'mensajeLogin',
          error?.message ||
          'Error al iniciar sesión'
        );
      }
    )
    .iniciarSesion({
      usuario,
      clave
    });
}


function mostrarSistema(sesion) {
  $('paginaLogin')
    ?.classList
    .add('oculto');

  $('paginaSistema')
    ?.classList
    .remove('oculto');

  setText(
    'nombreSesion',
    sesion.nombre
  );

  setText(
    'rolSesion',
    sesion.rol === 'ADMIN'
      ? 'ADMIN'
      : sesion
          .responsableAsignado
  );

  setText(
    'tituloBienvenida',
    `Bienvenido, ${sesion.nombre}`
  );

  setText(
    'subtituloDashboard',
    sesion.rol === 'ADMIN'
      ? 'Vista general de todos los tickets.'
      : `Puedes ver todos los tickets activos. Solo puedes editar los asignados a ${sesion.responsableAsignado}.`
  );

  $('botonUsuarios')
    ?.classList
    .toggle(
      'oculto',
      sesion.rol !== 'ADMIN'
    );

  $('botonDashboardAdmin')
    ?.classList
    .toggle(
      'oculto',
      sesion.rol !== 'ADMIN'
    );

  inicializarFiltrosDashboard();

  if (
    sesion.rol ===
    'ADMIN'
  ) {
    cambiarVista(
      'dashboard'
    );

  } else {
    cambiarVista(
      'bandeja'
    );
  }

  cargarListas();
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function inicializarFiltrosDashboard() {
  const selectorMes =
    $('dashMes');

  const selectorAnio =
    $('dashAnio');

  if (
    !selectorMes ||
    !selectorAnio
  ) {
    return;
  }

  const meses = [
    'Todos los meses',
    'Enero',
    'Febrero',
    'Marzo',
    'Abril',
    'Mayo',
    'Junio',
    'Julio',
    'Agosto',
    'Septiembre',
    'Octubre',
    'Noviembre',
    'Diciembre'
  ];

  selectorMes.innerHTML =
    meses
      .map(
        (
          nombre,
          indice
        ) => `
          <option value="${indice}">
            ${nombre}
          </option>
        `
      )
      .join('');

  const hoy =
    new Date();

  const anioActual =
    hoy.getFullYear();

  const anios = [
    anioActual - 2,
    anioActual - 1,
    anioActual,
    anioActual + 1
  ];

  selectorAnio.innerHTML =
    '<option value="">Todos los años</option>' +
    anios
      .map(
        anio => `
          <option value="${anio}">
            ${anio}
          </option>
        `
      )
      .join('');

  selectorMes.value =
    String(
      hoy.getMonth() + 1
    );

  selectorAnio.value =
    String(anioActual);
}


function cambiarVista(vista) {
  estado.vistaActual =
    vista;

  const esDashboard =
    vista === 'dashboard' &&
    estado.sesion?.rol ===
      'ADMIN';

  $('vistaDashboardAdmin')
    ?.classList
    .toggle(
      'oculto',
      !esDashboard
    );

  $('vistaBandeja')
    ?.classList
    .toggle(
      'oculto',
      esDashboard
    );

  $('botonDashboardAdmin')
    ?.classList
    .toggle(
      'activo',
      esDashboard
    );

  $('botonBandeja')
    ?.classList
    .toggle(
      'activo',
      !esDashboard
    );

  if (esDashboard) {
    setText(
      'tituloBienvenida',
      'Dashboard de supervisión'
    );

    setText(
      'subtituloDashboard',
      'Carga, productividad, tickets Portal reportados y estados por asesor.'
    );

    cargarDashboardAdmin();

  } else {
    setText(
      'tituloBienvenida',
      estado.sesion?.rol ===
        'ADMIN'
        ? 'Bandeja de tickets'
        : `Bienvenido, ${estado.sesion?.nombre || ''}`
    );

    setText(
      'subtituloDashboard',
      estado.sesion?.rol ===
        'ADMIN'
        ? 'Vista general de todos los tickets.'
        : `Puedes ver todos los tickets. Solo puedes editar los asignados a ${estado.sesion?.responsableAsignado || ''}.`
    );
  }
}


function cambiarVistaDashboard(vista) {
  estado.vistaDashboardActual =
    vista === 'diaria'
      ? 'diaria'
      : 'global';

  const esDiaria =
    estado
      .vistaDashboardActual ===
    'diaria';

  $('vistaGlobalDashboard')
    ?.classList
    .toggle(
      'oculto',
      esDiaria
    );

  $('vistaDiariaDashboard')
    ?.classList
    .toggle(
      'oculto',
      !esDiaria
    );

  $('botonVistaGlobalDashboard')
    ?.classList
    .toggle(
      'activo',
      !esDiaria
    );

  $('botonVistaDiariaDashboard')
    ?.classList
    .toggle(
      'activo',
      esDiaria
    );

  $('botonVistaGlobalDashboard')
    ?.setAttribute(
      'aria-selected',
      esDiaria
        ? 'false'
        : 'true'
    );

  $('botonVistaDiariaDashboard')
    ?.setAttribute(
      'aria-selected',
      esDiaria
        ? 'true'
        : 'false'
    );
}


/* =========================================================
   DASHBOARD
========================================================= */

function obtenerFiltrosDashboard() {
  return {
    mes:
      $('dashMes')?.value ||
      '',

    anio:
      $('dashAnio')?.value ||
      '',

    plataforma:
      $('dashPlataforma')
        ?.value ||
      '',

    asesor:
      $('dashAsesor')?.value ||
      '__GLOBAL__'
  };
}


function cargarDashboardAdmin() {
  if (
    estado.sesion?.rol !==
    'ADMIN'
  ) {
    return;
  }

  mostrarMensaje(
    'mensajeDashboard',
    'Actualizando dashboard...',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message ||
            'No se pudo cargar el dashboard'
          );

          return;
        }

        estado.dashboard =
          resultado;

        pintarDashboard(
          resultado
        );

        mostrarMensaje(
          'mensajeDashboard',
          '',
          'ok'
        );
      }
    )
    .withFailureHandler(
      error => {
        mostrarMensaje(
          'mensajeDashboard',
          error?.message ||
          'Error al cargar el dashboard'
        );
      }
    )
    .obtenerDashboardAdmin(
      estado.token,
      obtenerFiltrosDashboard()
    );
}


function pintarDashboard(datos) {
  setText(
    'dashActivos',
    datos.resumenGeneral
      ?.activos || 0
  );

  setText(
    'dashAtendidosZendesk',
    datos.resumenGeneral
      ?.atendidosZendesk || 0
  );

  setText(
    'dashAtendidosPortal',
    datos.resumenGeneral
      ?.atendidosPortal || 0
  );

  setText(
    'dashTotalAtendidos',
    datos.resumenGeneral
      ?.totalAtendidos || 0
  );

  const alertasPortal =
    normalizarAlertasPortal(
      datos.alertasPortal
    );

  setText(
    'dashAlertasPortal',
    datos.resumenGeneral
      ?.alertasPortal ??
    alertasPortal.length
  );

  const selectorAsesor =
    $('dashAsesor');

  if (selectorAsesor) {
    const filtroAsesor =
      datos.filtros?.asesor ||
      '__GLOBAL__';

    selectorAsesor.innerHTML =
      `
        <option
          value="__GLOBAL__"
          ${
            filtroAsesor ===
            '__GLOBAL__'
              ? 'selected'
              : ''
          }
        >
          Vista global
        </option>
      ` +
      (datos.asesores || [])
        .map(
          nombre => `
            <option
              value="${escapeHtml(nombre)}"
              ${
                nombre ===
                filtroAsesor
                  ? 'selected'
                  : ''
              }
            >
              ${escapeHtml(nombre)}
            </option>
          `
        )
        .join('');
  }

  setText(
    'dashNombreAsesor',
    datos.asesor?.nombre ||
    'Sin asesor seleccionado'
  );

  setText(
    'dashActivosAsesor',
    datos.asesor?.activos ||
    0
  );

  setText(
    'dashAtendidosAsesor',
    datos.asesor?.atendidos ||
    0
  );

  setText(
    'dashTiempoPromedio',
    datos.asesor
      ?.tiempoPromedio ||
    '0 minutos'
  );

  const disponibilidad =
    datos.asesor
      ?.disponibilidad || {
        texto: 'Disponible',
        nivel: 'disponible'
      };

  const etiqueta =
    $('dashDisponibilidad');

  if (etiqueta) {
    etiqueta.textContent =
      disponibilidad.texto;

    etiqueta.className =
      `etiqueta-disponibilidad ${disponibilidad.nivel}`;
  }

  const estados =
    datos.asesor?.estados ||
    {};

  setText(
    'dashEstadoRevision',
    estados.enRevision || 0
  );

  setText(
    'dashEstadoPendiente',
    estados.pendiente || 0
  );

  setText(
    'dashEstadoEspera',
    estados.enEspera || 0
  );

  setText(
    'dashEstadoSeguimiento',
    estados.seguimiento || 0
  );

  setText(
    'dashEstadoDerivado',
    estados.derivado || 0
  );

  setText(
    'dashEstadoAtendido',
    estados.atendido || 0
  );

  const plataforma =
    datos.asesor
      ?.plataforma || {
        zendesk: 0,
        portal: 0,
        total: 0
      };

  setText(
    'dashAsesorZendesk',
    plataforma.zendesk || 0
  );

  setText(
    'dashAsesorPortal',
    plataforma.portal || 0
  );

  const maxPlataforma =
    Math.max(
      Number(
        plataforma.zendesk ||
        0
      ),
      Number(
        plataforma.portal ||
        0
      ),
      1
    );

  if (
    $('barraAsesorZendesk')
  ) {
    $('barraAsesorZendesk')
      .style
      .width =
      `${
        (
          Number(
            plataforma.zendesk ||
            0
          ) /
          maxPlataforma
        ) * 100
      }%`;
  }

  if (
    $('barraAsesorPortal')
  ) {
    $('barraAsesorPortal')
      .style
      .width =
      `${
        (
          Number(
            plataforma.portal ||
            0
          ) /
          maxPlataforma
        ) * 100
      }%`;
  }

  estado.diarioDashboard =
    datos.diario || [];

  pintarDiarioDashboard(
    estado.diarioDashboard
  );

  pintarAtencionDiariaOrdenable(
    estado.diarioDashboard
  );

  pintarVistaDiariaDashboard(
    estado.diarioDashboard
  );

  pintarRankingDashboard(
    datos.ranking || []
  );

  pintarCampusDashboard(
    datos.campus || []
  );

  pintarDisponibilidadAsesores(
    datos
      .disponibilidadAsesores ||
    []
  );

  pintarAlertasAsignacion(
    datos.alertasAsignacion ||
    []
  );

  pintarSiguienteAsesor(
    datos.siguienteAsesor ||
      null,

    datos
      .pendientesAsignacionZendesk ||
      [],

    datos
      .disponibilidadAsesores ||
      []
  );

  pintarAlertasDatosDashboard(
    datos.alertasDatos || {
      total: 0,
      activas: 0,
      tickets: []
    }
  );

  pintarAlertasPortalDashboard(
    datos.alertasPortal,
    datos.responsablesPortal ||
    datos.alertasPortal
      ?.responsables ||
    []
  );

  pintarCalendarioLaboral(
    Array.isArray(
      datos.calendarioLaboral
    )
      ? datos.calendarioLaboral
      : datos.calendarioLaboral
          ?.registros ||
        []
  );

  const disponibles =
    datos.resumenGeneral
      ?.asesoresDisponibles ||
    0;

  setText(
    'dashCantidadDisponibles',
    `${disponibles} disponible${disponibles === 1 ? '' : 's'}`
  );

  setText(
    'tituloAtencionDiaria',
    datos.asesor?.esGlobal
      ? 'Atención diaria global'
      : `Atención diaria de ${datos.asesor?.nombre || ''}`
  );

  cambiarVistaDashboard(
    estado.vistaDashboardActual ||
    'global'
  );
}


/* =========================================================
   ALERTAS PORTAL
========================================================= */

function normalizarAlertasPortal(datos) {
  if (Array.isArray(datos)) {
    return datos;
  }

  if (
    Array.isArray(
      datos?.pendientes
    )
  ) {
    return datos.pendientes;
  }

  if (
    Array.isArray(
      datos?.alertas
    )
  ) {
    return datos.alertas;
  }

  if (
    Array.isArray(
      datos?.tickets
    )
  ) {
    return datos.tickets;
  }

  return [];
}


function pintarAlertasPortalDashboard(
  datos,
  responsables
) {
  const tbody =
    $('cuerpoAlertasPortal');

  if (!tbody) {
    return;
  }

  const alertas =
    normalizarAlertasPortal(
      datos
    );

  const listaResponsables =
    Array.isArray(
      responsables
    )
      ? responsables
      : [];

  estado.alertasPortal =
    alertas;

  setText(
    'contadorAlertasPortal',
    `${alertas.length} pendiente${alertas.length === 1 ? '' : 's'}`
  );

  if (
    $('botonProcesarAlertasPortal')
  ) {
    $('botonProcesarAlertasPortal')
      .disabled =
      !alertas.length;
  }

  if (!alertas.length) {
    tbody.innerHTML = `
      <tr>
        <td
          colspan="9"
          class="vacio"
        >
          No existen tickets Portal reportados.
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML =
    alertas
      .map(
        (
          alerta,
          indice
        ) => {
          const responsableAnterior =
            alerta.responsableAnterior ||
            alerta.responsable_anterior ||
            alerta.anterior ||
            '';

          const opciones =
            listaResponsables
              .map(item => {
                const asesor =
                  typeof item ===
                  'string'
                    ? item
                    : item.asesor ||
                      item.nombre ||
                      item.responsable ||
                      '';

                if (
                  !asesor ||
                  normalizarCliente(
                    asesor

function formatearFechaIsoVista(
  fechaIso
) {
  const texto =
    String(
      fechaIso || ''
    );

  const partes =
    texto.match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );

  if (!partes) {
    return texto || '-';
  }

  return (
    `${partes[3]}/` +
    `${partes[2]}/` +
    `${partes[1]}`
  );
}

function pintarAlertasDatosDashboard(
  datos
) {
  const contenedor =
    $('listaAlertasDatos');

  if (!contenedor) {
    return;
  }

  const tickets =
    datos?.tickets ||
    [];

  const total =
    Number(
      datos?.total ??
      tickets.length ??
      0
    );

  setText(
    'contadorAlertasDatos',
    `${total} pendiente${total === 1 ? '' : 's'}`
  );

  if (
    $('botonNotificarTodosDatos')
  ) {
    $('botonNotificarTodosDatos')
      .disabled =
      total === 0;
  }

  if (!total) {
    contenedor.innerHTML = `
      <div class="sin-datos">
        No hay tickets activos con datos incompletos.
      </div>
    `;

    aplicarEstadoAlertasDatos();
    return;
  }

  const porResponsable =
    {};

  tickets.forEach(
    ticket => {
      const responsable =
        ticket.responsable ||
        'Sin responsable';

      if (
        !porResponsable[
          responsable
        ]
      ) {
        porResponsable[
          responsable
        ] = [];
      }

      porResponsable[
        responsable
      ].push(ticket);
    }
  );

  const grupos =
    Object
      .entries(
        porResponsable
      )
      .sort(
        (a, b) =>
          b[1].length -
            a[1].length ||
          a[0].localeCompare(
            b[0],
            'es'
          )
      );

  contenedor.innerHTML =
    grupos
      .map(
        (
          [
            responsable,
            lista
          ],
          indice
        ) => {
          const abierto =
            Boolean(
              estado
                .responsablesAlertasAbiertos[
                  responsable
                ]
            );

          return `
            <article class="alerta-datos-card">
              <div class="alerta-datos-cabecera">
                <button
                  class="boton-toggle-responsable"
                  type="button"
                  data-responsable="${escapeHtml(responsable)}"
                  aria-expanded="${abierto ? 'true' : 'false'}"
                >
                  <span class="icono-toggle-responsable">
                    ${abierto ? '▼' : '▶'}
                  </span>

                  <span>
                    <strong>
                      ${escapeHtml(responsable)}
                    </strong>

                    <small>
                      ${lista.length}
                      ticket(s) incompleto(s)
                    </small>
                  </span>
                </button>

                <button
                  class="boton boton-secundario boton-notificar-responsable"
                  type="button"
                  data-indice="${indice}"
                >
                  Notificar
                </button>
              </div>

              <div
                class="alerta-datos-lista ${abierto ? '' : 'oculto'}"
              >
                ${lista
                  .map(
                    ticket => `
                      <div class="alerta-datos-ticket">
                        <span>
                          #${escapeHtml(ticket.ticket || '-')}
                          ·
                          ${escapeHtml(ticket.alumno || '-')}
                        </span>

                        <small>
                          Falta:
                          ${escapeHtml(
                            (
                              ticket.camposFaltantes ||
                              []
                            ).join(', ')
                          )}
                        </small>

                        <button
                          class="icono-alerta-datos"
                          type="button"
                          data-editar-ticket="${escapeHtml(ticket.numero)}"
                        >
                          !
                        </button>
                      </div>
                    `
                  )
                  .join('')}
              </div>
            </article>
          `;
        }
      )
      .join('');

  contenedor
    .querySelectorAll(
      '.boton-toggle-responsable'
    )
    .forEach(
      boton => {
        boton.addEventListener(
          'click',
          () => {
            const responsable =
              boton.dataset
                .responsable;

            estado
              .responsablesAlertasAbiertos[
                responsable
              ] =
              !estado
                .responsablesAlertasAbiertos[
                  responsable
                ];

            pintarAlertasDatosDashboard(
              datos
            );
          }
        );
      }
    );

  contenedor
    .querySelectorAll(
      '.boton-notificar-responsable'
    )
    .forEach(
      boton => {
        boton.addEventListener(
          'click',
          () => {
            const indice =
              Number(
                boton.dataset.indice
              );

            const lista =
              grupos[
                indice

            notificarDatosResponsable(
              lista.map(
                ticket =>

            );
          }
        );
      }
    );

  contenedor
    .querySelectorAll(
      '[data-editar-ticket]'

      boton => {

function aplicarColoresAsesores(
  selector,
  disponibilidad
) {
  if (!selector) {
    return;
  }

  Array
    .from(
      selector.options
    )
    .forEach(
      opcion => {
        const item =
          (
            disponibilidad ||
            []
          )
            .find(
              fila =>
                fila.asesor ===
                opcion.value
            );

        if (!item) {
          return;
        }

        if (
          item.disponible
        ) {
          opcion.style
            .backgroundColor =
            '#dcfce7';

          opcion.style.color =
            '#166534';

        } else {
          opcion.style
            .backgroundColor =
            '#fee2e2';

          opcion.style.color =
            '#991b1b';
        }
      }
    );
}

function convertirFechaOrdenAsesorUI(
  valor
) {
  if (!valor) {
    /*
     * Quien nunca recibió una asignación
     * debe aparecer primero en un empate.
     */
    return 0;
  }

  if (
    valor instanceof Date &&
    !isNaN(valor.getTime())
  ) {
    return valor.getTime();
  }

  const texto =
    String(valor).trim();

  /*
   * Formatos:
   * dd/MM/yyyy
   * dd/MM/yyyy HH:mm
   * dd/MM/yyyy HH:mm:ss
   */
  const coincidencia =
    texto.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
    );

  if (coincidencia) {
    return new Date(
      Number(coincidencia[3]),
      Number(coincidencia[2]) - 1,
      Number(coincidencia[1]),
      Number(coincidencia[4] || 0),
      Number(coincidencia[5] || 0),
      Number(coincidencia[6] || 0)
    ).getTime();
  }

  const fecha =
    new Date(texto);

  return isNaN(fecha.getTime())
    ? 0
    : fecha.getTime();
}


function obtenerPrioridadAsesorUI(
  asesor
) {
  const prioridadRegistrada =
    Number(
      asesor?.prioridad
    );

  if (
    Number.isFinite(
      prioridadRegistrada
    ) &&
    prioridadRegistrada > 0
  ) {
    return prioridadRegistrada;
  }

  const contabilizadosHoy =
    Number(
      asesor?.asignadosHoy ??
      asesor?.totalAtencionesHoy ??
      0
    );

  return contabilizadosHoy + 1;
}


function ordenarAsesoresAsignacionUI(
  disponibilidad
) {
  return (
    disponibilidad ||
    []
  )
    .filter(
      item =>
        item.activo &&
        item.habilitado
    )
    .slice()
    .sort(
      (
        a,
        b
      ) => {
        /*
         * PRIMER ORDEN:
         * disponibles antes que no disponibles.
         */
        const grupoA =
          a.disponible
            ? 0
            : 1;

        const grupoB =
          b.disponible
            ? 0
            : 1;

        if (
          grupoA !== grupoB
        ) {
          return grupoA - grupoB;
        }

        /*
         * SEGUNDO ORDEN:
         * prioridad menor primero.
         *
         * Prioridad 1 antes que 2,
         * prioridad 2 antes que 3, etc.
         */
        const prioridadA =
          obtenerPrioridadAsesorUI(
            a
          );

        const prioridadB =
          obtenerPrioridadAsesorUI(
            b
          );

        if (
          prioridadA !==
          prioridadB
        ) {
          return (
            prioridadA -
            prioridadB
          );
        }

        /*
         * TERCER ORDEN:
         * quien fue asignado hace más tiempo.
         */
        const fechaA =
          convertirFechaOrdenAsesorUI(
            a.ultimaAsignacion
          );

        const fechaB =
          convertirFechaOrdenAsesorUI(
            b.ultimaAsignacion
          );

        if (
          fechaA !== fechaB
        ) {
          return fechaA - fechaB;
        }

        /*
         * CUARTO ORDEN:
         * orden configurado del asesor.
         */
        const ordenA =
          Number(
            a.orden ||
            999
          );

        const ordenB =
          Number(
            b.orden ||
            999
          );

        if (
          ordenA !== ordenB
        ) {
          return ordenA - ordenB;
        }

        return String(
          a.asesor || ''
        ).localeCompare(
          String(
            b.asesor || ''
          ),
          'es'
        );
      }
    );
}


function crearOpcionesAsesoresUI(
  lista
) {
  return (
    lista ||
    []
  )
    .map(
      item => {
        const prioridad =
          obtenerPrioridadAsesorUI(
            item
          );

        const estadoTexto =
          item.texto ||
          (
            item.disponible
              ? 'Disponible'
              : 'No disponible'
          );

        return `
          <option
            value="${escapeHtml(item.asesor)}"
          >
            ${escapeHtml(item.asesor)}
            ·
            ${escapeHtml(estadoTexto)}
            · Prioridad ${prioridad}
          </option>
        `;
      }
    )
    .join('');
}


function pintarSiguienteAsesor(
  asesor,
  pendientes,
  disponibilidad
) {
  const boton =
    $('botonRegistrarAsignacion');

  const selectorTicket =
    $('ticketPendienteAsignacion');

  const selectorAsesor =
    $('asesorAsignacionManual');

  if (
    !boton ||
    !selectorTicket ||
    !selectorAsesor
  ) {
    return;
  }

  const listaPendientes =
    pendientes || [];

  selectorTicket.innerHTML =
    listaPendientes.length
      ? listaPendientes
          .map(
            ticket => `
              <option
                value="${escapeHtml(ticket.numero)}"
              >
                #${escapeHtml(ticket.ticket)}
                ·
                ${escapeHtml(
                  ticket.tipoTicket ||
                  'NUEVO'
                )}
                ·
                ${escapeHtml(
                  ticket.alumno ||
                  '-'
                )}
              </option>
            `
          )
          .join('')
      : `
          <option value="">
            Sin tickets Zendesk pendientes
          </option>
        `;

  /*
   * Ordena primero disponibles y luego
   * no disponibles.
   */
  const listaOrdenada =
    ordenarAsesoresAsignacionUI(
      disponibilidad
    );

  const disponibles =
    listaOrdenada.filter(
      item =>
        item.disponible
    );

  const noDisponibles =
    listaOrdenada.filter(
      item =>
        !item.disponible
    );

  let opciones = `
    <option value="">
      Usar asesor recomendado
    </option>
  `;

  if (disponibles.length) {
    opciones += `
      <optgroup label="DISPONIBLES">
        ${
          crearOpcionesAsesoresUI(
            disponibles
          )
        }
      </optgroup>
    `;
  }

  if (noDisponibles.length) {
    opciones += `
      <optgroup label="NO DISPONIBLES">
        ${
          crearOpcionesAsesoresUI(
            noDisponibles
          )
        }
      </optgroup>
    `;
  }

  selectorAsesor.innerHTML =
    opciones;

  aplicarColoresAsesores(
    selectorAsesor,
    disponibilidad || []
  );

  if (!asesor) {
    setText(
      'nombreSiguienteAsesor',
      'Sin asesor disponible'
    );

    setText(
      'detalleSiguienteAsesor',
      'No existe un asesor disponible para la asignación automática.'
    );

    boton.disabled = true;

  } else {
    const contabilizadosHoy =
      Number(
        asesor.totalAtencionesHoy ??
        asesor.asignadosHoy ??
        0
      );

    const prioridad =
      obtenerPrioridadAsesorUI(
        asesor
      );

    setText(
      'nombreSiguienteAsesor',
      asesor.asesor
    );

    setText(
      'detalleSiguienteAsesor',
      `${contabilizadosHoy} ticket(s) contabilizado(s) hoy · Prioridad ${prioridad} · Orden ${asesor.orden}`
    );

    boton.disabled =
      !listaPendientes.length;
  }

  estado
    .pendientesAsignacionZendesk =
    listaPendientes;

  mostrarAntecedenteAsignacion();
}

function mostrarAntecedenteAsignacion() {
  const numero =
    $('ticketPendienteAsignacion')
      ?.value ||
    '';

  const contenedor =
    $('antecedenteAsignacion');

  if (!contenedor) {
    return;
  }

  const ticket =
    (
      estado
        .pendientesAsignacionZendesk ||
      []
    )
      .find(
        item =>
          String(item.numero) ===
          String(numero)
      );

  if (
    !ticket?.antecedente
  ) {
    contenedor
      .classList
      .add('oculto');

    contenedor.innerHTML =
      '';

    return;
  }

  const antecedente =
    ticket.antecedente;

  contenedor
    .classList
    .remove('oculto');

  contenedor.innerHTML = `
    <strong>
      Antecedente
      ${escapeHtml(ticket.tipoTicket || '')}
    </strong>

    <span>
      Ticket anterior:
      #${escapeHtml(antecedente.ticket || '-')}
    </span>

    <span>
      Asesor anterior:
      ${escapeHtml(antecedente.responsable || '-')}
    </span>

    <span>
      Fecha anterior:
      ${escapeHtml(antecedente.fechaInicio || '-')}
    </span>

    <span>
      Plataforma:
      ${escapeHtml(antecedente.plataforma || '-')}
    </span>

    <span>
      Detalle:
      ${escapeHtml(antecedente.detalle || '-')}
    </span>
  `;
}


function asignarTicketZendeskSeleccionado() {
  const numero =
    $('ticketPendienteAsignacion')

  const asesorManual =
    $('asesorAsignacionManual')

    '';

      true;
  }

  mostrarMensaje(
    'mensajeDashboard',

  );

  google.script.run
    .withSuccessHandler(

          boton.disabled =

        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message ||
            'No se pudo asignar el ticket'
          );

          return;
        }

        mostrarMensaje(
          'mensajeDashboard',
          resultado.message ||
          'Ticket asignado',
          'ok'
        );

        cargarDashboardAdmin();
        cargarTickets();
      }
    )
    .withFailureHandler(
      error => {
        if (boton) {
          boton.disabled =
            false;
        }

        mostrarMensaje(
          'mensajeDashboard',
          error?.message ||

function procesarPendientesZendesk() {
  const boton =
    $('botonProcesarAutomaticos');

  if (boton) {
    boton.disabled =
      true;

    boton.textContent =
      'Procesando...';
  }

  mostrarMensaje(
    'mensajeDashboard',
    'Procesando tickets Zendesk pendientes...',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (boton) {
          boton.disabled =
            false;

          boton.textContent =
            'Procesar pendientes';
        }

        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message ||
            'No se pudieron procesar los tickets'
          );

          return;
        }

        mostrarMensaje(
          'mensajeDashboard',
          resultado.message ||
          'Tickets procesados',
          'ok'
        );

        /*
         * Actualiza únicamente la parte operativa:
         *
         * - Disponibilidad del equipo.
         * - Posición de los asesores.
         * - Siguiente asesor recomendado.
         * - Tickets pendientes.
         * - Alertas de asignación.
         *
         * No vuelve a cargar gráficos, ranking,
         * campus ni indicadores generales.
         */
        window.setTimeout(
          () => {
            if (
              typeof window
                .cargarDashboardOperativoRapido ===
              'function'
            ) {
              window
                .cargarDashboardOperativoRapido();

            } else {
              cargarDashboardAdmin();
            }
          },
          150
        );
      }
    )
    .withFailureHandler(
      error => {
        if (boton) {
          boton.disabled =
            false;

          boton.textContent =
            'Procesar pendientes';
        }

        mostrarMensaje(
          'mensajeDashboard',
          error?.message ||
          'Error al procesar tickets'
        );
      }
    )
    .procesarAsignacionAutomaticaZendesk(
      estado.token
    );
}

function pintarDisponibilidadAsesores(
  filas
) {
  const contenedor =
    $('listaDisponibilidadAsesores');

  if (!contenedor) {
    return;
  }

  const todos =
    [
      ...(filas || [])
    ];

  /*
   * Mantiene el orden de prioridad para
   * los asesores habilitados.
   */
  const habilitados =
    typeof ordenarAsesoresAsignacionUI ===
      'function'
      ? ordenarAsesoresAsignacionUI(
          todos.filter(
            item =>
              item.habilitado
          )
        )
      : todos.filter(
          item =>
            item.habilitado
        );

  /*
   * Los asesores deshabilitados no se eliminan.
   * Se colocan al final y aparecerán en plomo.
   */
  const deshabilitados =
    todos
      .filter(
        item =>
          !item.habilitado
      )
      .sort(
        (a, b) =>
          Number(
            a.orden || 999
          ) -
            Number(
              b.orden || 999
            ) ||
          String(
            a.asesor || ''
          ).localeCompare(
            String(
              b.asesor || ''
            ),
            'es'
          )
      );

  const lista = [
    ...habilitados,
    ...deshabilitados
  ];

  if (!lista.length) {
    contenedor.innerHTML = `
      <div class="sin-datos">
        No hay asesores registrados.
      </div>
    `;

    return;
  }

  contenedor.innerHTML =
    lista
      .map(
        fila => {
          /*
           * Los deshabilitados utilizan
           * obligatoriamente el estilo bloqueado.
           */
          const claseNivel =
            !fila.habilitado
              ? 'bloqueado'
              : normalizarCliente(
                  fila.nivel
                )
                  .toLowerCase()
                  .replace(
                    /\s+/g,
                    '-'
                  );

          const textoEstado =
            !fila.habilitado
              ? 'No participa'
              : fila.texto || '';

          return `
            <article
              class="asesor-disponibilidad asesor-${escapeHtml(claseNivel)}"
            >
              <label class="check-asignacion">
                <input
                  type="checkbox"
                  data-usuario="${escapeHtml(fila.usuario)}"
                  ${fila.habilitado ? 'checked' : ''}
                >

                <span></span>
              </label>

              <button
                class="asesor-info"
                type="button"
                data-asesor="${escapeHtml(fila.asesor)}"
              >
                <strong>
                  ${escapeHtml(fila.asesor)}
                </strong>

                <small>
                  ${Number(
                    fila.totalAtencionesHoy ??
                    fila.asignadosHoy ??
                    0
                  )}
                  activo(s) hoy
                  ·
                  ${Number(fila.revision || 0)}
                  revisión
                  ·
                  ${Number(fila.seguimiento || 0)}
                  seguimiento
                </small>

                <em>
                  ${escapeHtml(textoEstado)}
                </em>
              </button>

              <span
                class="punto-disponibilidad ${escapeHtml(claseNivel)}"
              ></span>
            </article>
          `;
        }
      )
      .join('');

  contenedor
    .querySelectorAll(
      '.asesor-info'
    )
    .forEach(
      boton => {
        boton.addEventListener(
          'click',
          () => {
            if (
              $('dashAsesor')
            ) {
              $('dashAsesor').value =
                boton.dataset.asesor;
            }

            cargarDashboardAdmin();
          }
        );
      }
    );

  contenedor
    .querySelectorAll(
      '.check-asignacion input'
    )
    .forEach(
      check => {
        check.addEventListener(
          'change',
          () => {
            actualizarHabilitadoAsesor(
              check.dataset.usuario,
              check.checked
            );
          }
        );
      }
    );
}


function actualizarHabilitadoAsesor(
  usuario,
  habilitado
) {
  mostrarMensaje(
    'mensajeDashboard',
    habilitado
      ? 'Habilitando asesor...'
      : 'Deshabilitando asesor...',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message ||
            'No se pudo actualizar la habilitación'
          );

          cargarDashboardAdmin();
          return;
        }

        const disponibilidad =
          resultado.disponibilidad || [];

        /*
         * Actualiza solamente las tarjetas.
         * No vuelve a cargar todo el dashboard.
         */
        pintarDisponibilidadAsesores(
          disponibilidad
        );

        const disponibles =
          Number(
            resultado.disponibles || 0
          );

        setText(
          'dashCantidadDisponibles',
          `${disponibles} disponible${
            disponibles === 1
              ? ''
              : 's'
          }`
        );

        pintarAlertasAsignacion(
          resultado.alertasAsignacion || []
        );

        pintarSiguienteAsesor(
          resultado.siguienteAsesor || null,

          estado.dashboard
            ?.pendientesAsignacionZendesk ||
            [],

          disponibilidad
        );

        if (estado.dashboard) {
          estado.dashboard
            .disponibilidadAsesores =
            disponibilidad;

          estado.dashboard
            .siguienteAsesor =
            resultado.siguienteAsesor ||
            null;

          estado.dashboard
            .alertasAsignacion =
            resultado.alertasAsignacion ||
            [];

          if (
            estado.dashboard
              .resumenGeneral
          ) {
            estado.dashboard
              .resumenGeneral
              .asesoresDisponibles =
              disponibles;
          }
        }

        mostrarMensaje(
          'mensajeDashboard',
          resultado.message,
          'ok'
        );
      }
    )
    .withFailureHandler(
      error => {
        mostrarMensaje(
          'mensajeDashboard',
          error?.message ||
          'Error al actualizar la habilitación'
        );

        cargarDashboardAdmin();
      }
    )
    .actualizarHabilitadoAsignacion(
      estado.token,
      usuario,
      habilitado
    );
}

function pintarVistaDiariaDashboard(
  filas
) {
  const selector =
    $('filtroDiaDashboard');

  const tbody =
    $('cuerpoVistaDiariaDashboard');

  if (
    !selector ||
    !tbody
  ) {
    return;
  }

  const lista =
    filas || [];

  const valorActual =
    selector.value;

  selector.innerHTML =
    '<option value="">Todos los días del periodo</option>' +
    lista
      .map(
        fila => `
          <option value="${escapeHtml(fila.clave)}">
            ${escapeHtml(fila.fecha)}
          </option>
        `
      )
      .join('');

  if (
    valorActual &&
    lista.some(
      fila =>
        fila.clave ===
        valorActual
    )
  ) {
    selector.value =
      valorActual;
  }

  const claveSeleccionada =
    selector.value;

  const filasVista =
    claveSeleccionada
      ? lista.filter(
          fila =>
            fila.clave ===
            claveSeleccionada
        )
      : lista;

  const totalPeriodo =
    lista.reduce(
      (
        total,
        fila
      ) =>
        total +
        Number(
          fila.totalAtendido ||
          0
        ),
      0
    );

  const diasActivos =
    lista.filter(
      fila =>
        Number(
          fila.totalAtendido ||
          0
        ) > 0
    ).length;

  const promedio =
    diasActivos
      ? totalPeriodo /
        diasActivos
      : 0;

  const maximo =
    lista.length
      ? Math.max(
          ...lista.map(
            fila =>
              Number(
                fila.totalAtendido ||
                0
              )
          )
        )
      : 0;

  setText(
    'dashDiarioTotalPeriodo',
    totalPeriodo
  );

  setText(
    'dashDiarioDiasActivos',
    diasActivos
  );

  setText(
    'dashDiarioPromedio',
    promedio.toFixed(1)
  );

  setText(
    'dashDiarioMaximo',
    maximo
  );

  if (!filasVista.length) {
    tbody.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="sin-datos"
        >
          No hay tickets atendidos para el periodo seleccionado.
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML =
    filasVista
      .map(
        fila => `
          <tr>
            <td>
              ${escapeHtml(fila.fecha)}
            </td>

            <td>
              ${Number(fila.atendidoZendesk || 0)}
            </td>

            <td>
              ${Number(fila.atendidoPortal || 0)}
            </td>

            <td>
              <strong>
                ${Number(fila.totalAtendido || 0)}
              </strong>
            </td>
          </tr>
        `
      )
      .join('');
}


function ordenarFilasAtencionDiaria(
  filas
) {
  const orden =
    $('ordenAtencionDiaria')
      ?.value ||
    estado
      .ordenAtencionDiaria ||
    'fecha_desc';

  estado.ordenAtencionDiaria =
    orden;

  const copia = [
    ...(filas || [])
  ];

  copia.sort(
    (a, b) => {
      if (
        orden ===
        'fecha_asc'
      ) {
        return String(
          a.clave || ''
        ).localeCompare(
          String(
            b.clave || ''
          )
        );
      }

      if (
        orden ===
        'total_desc'
      ) {
        return (
          Number(
            b.totalAtendido ||
            0
          ) -
            Number(
              a.totalAtendido ||
              0
            )
        );
      }

      if (
        orden ===
        'total_asc'
      ) {
        return (
          Number(
            a.totalAtendido ||
            0
          ) -
            Number(
              b.totalAtendido ||
              0
            )
        );
      }

      if (
        orden ===
        'zendesk_desc'
      ) {
        return (
          Number(
            b.atendidoZendesk ||
            0
          ) -
          Number(
            a.atendidoZendesk ||
            0
          )
        );
      }

      if (
        orden ===
        'portal_desc'
      ) {
        return (
          Number(
            b.atendidoPortal ||
            0
          ) -
          Number(
            a.atendidoPortal ||
            0
          )
        );
      }

      return String(
        b.clave || ''
      ).localeCompare(
        String(
          a.clave || ''
        )
      );
    }
  );

  return copia;
}

          !resultado ||
          !resultado.ok
        ) {
          console.error(
            resultado?.message ||
            'No se pudieron actualizar las listas'
          );

          cargarTickets();
          return;
        }

        estado.listas =
          resultado.listas || {
            campus: [],
            tipoIngreso: [],
            tipoConvalidacion: [],
            tipoReevaluacion: [],
            detalle: [],
            responsables: []

function cargarTickets() {
  if (
    $('panelesTickets')
  ) {
    $('panelesTickets')
      .innerHTML = `
        <div class="cargando-tabla">
          Cargando tickets...
        </div>
      `;
  }

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          const mensaje =
            escapeHtml(
              resultado?.message ||
              'No se pudieron cargar los tickets'
            );

          if (
            $('panelesTickets')
          ) {
            $('panelesTickets')
              .innerHTML = `
                <div class="vacio">
                  ${mensaje}
                </div>
              `;
          }

          return;
        }

        estado.tickets =
          resultado.tickets ||
          [];

        pintarResumen(
          resultado.resumen ||
          {}
        );

        pintarPanelesTickets(
          estado.tickets
        );

        cargarAlertasDatosUsuario();
      }
    )
    .withFailureHandler(
      error => {
        const mensaje =
          escapeHtml(
            error?.message ||
            'Error de conexión'
          );

        if (
          $('panelesTickets')
        ) {
          $('panelesTickets')
            .innerHTML = `
              <div class="vacio">
                ${mensaje}
              </div>
            `;
        }
      }
    )
    .obtenerTickets(
      estado.token,
      obtenerFiltros()
    );
}

  );

  setText(

  );

function ordenarTicketsPanel(
  tickets
) {
  const orden =
    $('ordenTickets')
      ?.value ||
    'numero_desc';

  const copia = [
    ...(tickets || [])
  ];

  copia.sort(
    (a, b) => {
      if (
        orden ===
        'numero_asc'
      ) {
        return (
          Number(a.numero || 0) -
          Number(b.numero || 0)
        );
      }

      if (
        orden ===
        'asesor_asc'
      ) {
        return String(
          a.responsable || ''
        ).localeCompare(
          String(
            b.responsable || ''
          ),
          'es'
        );
      }

      if (
        orden ===
        'campus_asc'
      ) {
        return String(
          a.campus || ''
        ).localeCompare(
          String(
            b.campus || ''
          ),
          'es'
        );
      }

      return (
        Number(b.numero || 0) -
        Number(a.numero || 0)
      );
    }
  );

  return copia;
}


function grupoTicket(ticket) {
  const detalle =
    normalizarCliente(
      ticket.detalle
    );

  const estadoTicket =
    normalizarCliente(
      ticket.estado
    );

  if (
    detalle ===
    'EN REVISION'
  ) {
    return 'EN REVISION';
  }

  if (
    detalle ===
    'PENDIENTE'
  ) {
    return 'PENDIENTE';
  }

  if (
    detalle ===
    'EN ESPERA'
  ) {
    return 'EN ESPERA';
  }

  if (
    detalle ===
    'SEGUIMIENTO'
  ) {
    return 'SEGUIMIENTO';
  }

  if (
    detalle ===
    'DERIVADO'
  ) {
    return 'DERIVADO';
  }

  if (
    detalle ===
    'ATENDIDO'
  ) {
    return 'ATENDIDO';
  }

  if (
    detalle ===
      'CERRADO' ||
    estadoTicket ===
      'CERRADO'
  ) {
    return 'CERRADO';
  }

  return 'PENDIENTE';
}


function etiquetaPanel(grupo) {
  return {
    'EN REVISION':
      'En revisión',

    'PENDIENTE':
      'Pendiente',

    'EN ESPERA':
      'En espera',

    'SEGUIMIENTO':
      'Seguimiento',

    'DERIVADO':
      'Derivado',

    'ATENDIDO':
      'Atendido',

    'CERRADO':
      'Cerrado'
  }[grupo] || grupo;
}


function camposFaltantesTicket(
  ticket
) {
  const faltantes =
    [];

  if (
    !String(
      ticket.campus || ''
    ).trim() ||
    normalizarCliente(
      ticket.campus
    ) === '#N/D'
  ) {
    faltantes.push(
      'Campus'
    );
  }

  if (
    !String(
      ticket.tipoConvalidacion ||
      ''
    ).trim()
  ) {
    faltantes.push(
      'Tipo de convalidación'
    );
  }

  if (
    !String(
      ticket.tipoIngreso ||
      ''
    ).trim()
  ) {
    faltantes.push(
      'Tipo de ingreso'
    );
  }

  if (
    normalizarCliente(
      ticket.tipoTicket
    ) === 'REEVALUADO' &&
    !String(
      ticket.tipoReevaluacion ||
      ''
    ).trim()
  ) {
    faltantes.push(
      'Tipo de reevaluación'
    );
  }

  return faltantes;
}


function ticketTieneAlertaDatos(
  ticket
) {
  const detalle =
    normalizarCliente(
      ticket.detalle
    );

  const estadoTicket =
    normalizarCliente(
      ticket.estado
    );

  return (
    ![
      'ATENDIDO',
      'DERIVADO',
      'CERRADO'
    ].includes(detalle) &&
    estadoTicket !==
      'CERRADO' &&
    camposFaltantesTicket(
      ticket
    ).length > 0
  );
}


function cargarAlertasDatosUsuario() {
  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          return;
        }

        estado.alertasDatos =
          resultado.tickets ||
          [];

        pintarBarraAlertasUsuario(
          resultado
        );
      }
    )
    .obtenerAlertasDatosUsuario(
      estado.token
    );
}


function pintarBarraAlertasUsuario(
  resultado
) {
  const barra =
    $('barraAlertasDatosUsuario');

  if (!barra) {
    return;
  }

  const total =
    resultado
      .totalNotificadas ||
    0;

  if (!total) {
    barra
      .classList
      .add('oculto');

    barra.innerHTML =
      '';

    return;
  }

  barra
    .classList
    .remove('oculto');

  barra.innerHTML = `
    <span class="barra-alerta-icono">
      !
    </span>

    <span>
      Tienes ${total} ticket(s) notificado(s)
      con información por actualizar.
    </span>

    <button
      type="button"
      class="boton-alerta-ver"
      id="botonVerTicketsAlertados"
    >
      Ver tickets
    </button>
  `;

  $('botonVerTicketsAlertados')
    ?.addEventListener(
      'click',
      filtrarTicketsConAlertas
    );
}


function filtrarTicketsConAlertas() {
  const numeros =
    new Set(
      (
        estado.alertasDatos ||
        []
      )
        .filter(
          item =>
            item.notificada
        )
        .map(
          item =>
            String(
              item.numero
            )
        )
    );

  pintarPanelesTickets(
    estado.tickets.filter(
      ticket =>
        numeros.has(
          String(
            ticket.numero
          )
        )
    )
  );
}


function textoAccionTicket(ticket) {
  const esAdmin =
    estado.sesion?.rol ===
    'ADMIN';

  const esResponsable =
    normalizarCliente(
      ticket.responsable
    ) ===
    normalizarCliente(
      estado.sesion
        ?.responsableAsignado
    );

  return (
    esAdmin ||
    esResponsable
  )
    ? 'Editar'
    : 'Ver';
}

function pintarPanelesTickets(
  tickets
) {
  const contenedor =
    $('panelesTickets');

  if (!contenedor) {
    return;
  }

  const ordenPaneles = [
    'EN REVISION',
    'PENDIENTE',
    'EN ESPERA',
    'SEGUIMIENTO',
    'DERIVADO',
    'ATENDIDO',
    'CERRADO'
  ];

  const grupos =
    Object.fromEntries(
      ordenPaneles.map(
        grupo => [
          grupo,
          []
        ]
      )
    );

  ordenarTicketsPanel(
    tickets || []
  )
    .forEach(
      ticket => {
        const grupo =
          grupoTicket(ticket);

        grupos[grupo]
          .push(ticket);
      }
    );

  const paneles =
    ordenPaneles.filter(
      grupo =>
        grupos[grupo].length
    );

  if (!paneles.length) {
    contenedor.innerHTML = `
      <div class="vacio">
        No se encontraron tickets.
      </div>
    `;

    return;
  }

  contenedor.innerHTML =
    paneles
      .map(
        grupo => {
          const abierto =
            estado
              .panelesAbiertos[
                grupo
              ] !== false;

          return `
            <section class="panel-ticket">
              <button
                class="panel-ticket-cabecera"
                type="button"
                data-panel="${grupo}"
              >
                <span>
                  ${abierto ? '▼' : '▶'}
                </span>

                <strong>
                  ${etiquetaPanel(grupo)}
                </strong>

                <span class="panel-ticket-conteo">
                  ${grupos[grupo].length}
                </span>
              </button>

              <div
                class="panel-ticket-contenido ${abierto ? '' : 'oculto'}"
              >
                <div class="tabla-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>N°</th>
                        <th>Ticket</th>
                        <th>Tipo ticket</th>
                        <th>DNI</th>
                        <th>Alumno</th>
                        <th>Origen</th>
                        <th>Responsable</th>
                        <th>Campus</th>
                        <th>Detalle</th>
                        <th>Estado</th>
                        <th>Registro</th>
                        <th>Ticket Portal</th>
                        <th>Alerta</th>
                        <th>Acción</th>
                      </tr>
                    </thead>

                    <tbody>
                      ${grupos[grupo]
                        .map(
                          filaTicketPanel
                        )
                        .join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          `;
        }
      )
      .join('');

  contenedor
    .querySelectorAll(
      '.panel-ticket-cabecera'
    )
    .forEach(
      boton => {
        boton.addEventListener(
          'click',
          () => {
            const grupo =
              boton.dataset.panel;

            estado
              .panelesAbiertos[
                grupo
              ] =
              !estado
                .panelesAbiertos[
                  grupo
                ];

            pintarPanelesTickets(
              tickets
            );
          }
        );
      }
    );

  activarBotonesEditarTickets(
    contenedor
  );
}

function editarTicket(numero) {
  const modal =
    $('modalTicket');

  if (!modal) {
    console.error(

  modal
    .classList
    .remove('oculto');

  setText(
    'tituloModalTicket',
    'Cargando ticket...'
  );

  setText(
    'subtituloModalTicket',
    'Consultando información...'
  );

  mostrarMensaje(
    'mensajeTicket',
    '',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarErrorModalTicket(
            resultado?.message ||
            'No se pudo cargar el ticket'
          );

          return;
        }

        try {
          estado.ticketActual =
            resultado.ticket;

          estado.permisosTicket =
            resultado.permisos ||
            {};

          pintarModalTicket(
            resultado.ticket,
            resultado.permisos ||
            {}
          );

        } catch (error) {
          mostrarErrorModalTicket(
            error?.message ||
            'Error al mostrar el ticket'
          );

          console.error(error);
        }
      }
    )
    .withFailureHandler(
      error => {
        mostrarErrorModalTicket(
          error?.message ||
          'Error de conexión con el servidor'
        );
      }
    )
    .obtenerTicketPorNumero(
      estado.token,
      String(
        numero || ''
      ).trim()
    );
}


function actualizarCampoTipoReevaluacion(
  ticket
) {
  const grupo =
    $('grupoTipoReevaluacion');

  const selector =
    $('editTipoReevaluacion');

  if (
    !grupo ||
    !selector
  ) {
    return;
  }

  const esReevaluado =
    normalizarCliente(
      ticket?.tipoTicket
    ) === 'REEVALUADO';

  grupo
    .classList
    .toggle(
      'oculto',
      !esReevaluado
    );

  selector.disabled =
    !esReevaluado ||
    Boolean(
      estado.permisosTicket
        ?.soloLectura
    );
}


function aplicarPermisosModalTicket(
  permisos
) {
  const soloLectura =
    Boolean(
      permisos?.soloLectura
    );

  [
    'editDni',
    'editAlumno',
    'editCampus',
    'editTipoIngreso',
    'editTipoConvalidacion',
    'editTipoReevaluacion',
    'editObservacion'
  ].forEach(
    id => {
      if ($(id)) {
        $(id).disabled =
          soloLectura;
      }
    }
  );

  if (
    $('editResponsable')
  ) {
    $('editResponsable').disabled =
      soloLectura ||
      !permisos
        ?.puedeEditarResponsable;
  }

  if (
    $('editDetalle')
  ) {
    $('editDetalle').disabled =
      soloLectura ||
      !permisos
        ?.puedeEditarDetalle;
  }

  if (
    $('botonGuardarTicket')
  ) {
    $('botonGuardarTicket')
      .disabled =
      soloLectura;
  }

  const botonPortal =
    $('botonReportarPortal');

  if (botonPortal) {
    const puedeReportar =
      Boolean(
        permisos
          ?.puedeReportarPortal
      );

    botonPortal
      .classList
      .toggle(
        'oculto',
        !puedeReportar
      );

    botonPortal.disabled =
      !puedeReportar;
  }
}


function pintarModalTicket(
  ticket,
  permisos
) {
  setText(
    'tituloModalTicket',
    `Ticket ${ticket.ticket || ''}`
  );

  setText(
    'subtituloModalTicket',
    `${ticket.alumno || '-'} · ${ticket.origen || '-'}`
  );

  setText(
    'editNumero',
    ticket.numero || ''
  );

  setText(
    'editTicket',
    ticket.ticket || ''
  );

  if (
    $('editTipoTicket')
  ) {
    $('editTipoTicket')
      .innerHTML =
      htmlTipoTicket(
        ticket.tipoTicket
      );
  }

  if (
    $('editDni')
  ) {
    $('editDni').value =
      ticket.dni || '';
  }

  if (
    $('editAlumno')
  ) {
    $('editAlumno').value =
      ticket.alumno || '';
  }

  setText(
    'editOrigen',
    ticket.origen || '-'
  );

  if (
    $('editObservacion')
  ) {
    $('editObservacion').value =
      ticket.observacion ||
      '';
  }

  llenarSelect(
    'editResponsable',
    estado
      .listas
      ?.responsables ||
      [],
    ticket.responsable
  );

  llenarSelect(
    'editCampus',
    estado.listas?.campus ||
      [],
    ticket.campus
  );

  llenarSelect(
    'editTipoIngreso',
    estado
      .listas
      ?.tipoIngreso ||
      [],
    ticket.tipoIngreso
  );

  llenarSelect(
    'editTipoConvalidacion',
    estado
      .listas
      ?.tipoConvalidacion ||
      [],
    ticket.tipoConvalidacion
  );

  llenarSelect(
    'editTipoReevaluacion',
    estado
      .listas
      ?.tipoReevaluacion ||
      [],
    ticket.tipoReevaluacion
  );

  llenarSelect(
    'editDetalle',
    estado.listas?.detalle ||
      [],
    ticket.detalle
  );

  aplicarPermisosModalTicket(
    permisos
  );

  actualizarCampoTipoReevaluacion(
    ticket
  );

  setText(
    'infoRegistro',
    ticket.registro || '-'
  );

  setText(
    'infoTiempoInicio',
    ticket.tiempoInicio || '-'
  );

  setText(
    'infoTiempoFin',
    ticket.tiempoFin || '-'
  );

  if (
    $('infoTicketPortal')
  ) {
    $('infoTicketPortal')
      .innerHTML =
      htmlIndicadorPortal(
        ticket
      );
  }

  setText(
    'infoCambios',
    ticket.numeroCambios ||
    '0'
  );

  setText(
    'infoUltimoUsuario',
    ticket
      .usuarioUltimaModificacion ||
    '-'
  );

  mostrarMensaje(
    'mensajeTicket',
    permisos?.soloLectura
      ? 'Vista de consulta: no tienes permisos para modificar este ticket.'
      : '',
    'ok'
  );
}


function cerrarModalTicket() {
  $('modalTicket')
    ?.classList
    .add('oculto');

  estado.ticketActual =
    null;

  estado.permisosTicket =
    null;
}


function recopilarEdicionTicket() {
  return {
    numero:
      estado.ticketActual
        ?.numero ||
      '',

    dni:
      $('editDni')?.value ||
      '',

    alumno:
      $('editAlumno')?.value ||
      '',

    responsable:
      $('editResponsable')
        ?.value ||
      '',

    campus:
      $('editCampus')?.value ||
      '',

    tipoIngreso:
      $('editTipoIngreso')
        ?.value ||
      '',

    tipoConvalidacion:
      $('editTipoConvalidacion')
        ?.value ||
      '',

    tipoReevaluacion:
      $('editTipoReevaluacion')
        ?.value ||
      '',

    detalle:
      $('editDetalle')?.value ||
      '',

    observacion:
      $('editObservacion')
        ?.value ||
      ''
  };
}


function guardarTicketActual() {
  if (
    !estado.ticketActual
  ) {
    return;
  }

  const datos =
    recopilarEdicionTicket();

  if (!datos.campus) {
    mostrarMensaje(
      'mensajeTicket',
      'Selecciona el Campus'
    );

    return;
  }

  if (
    !datos.tipoIngreso
  ) {
    mostrarMensaje(
      'mensajeTicket',
      'Selecciona el Tipo de ingreso'
    );

    return;
  }

  if (
    !datos.tipoConvalidacion
  ) {
    mostrarMensaje(
      'mensajeTicket',
      'Selecciona el Tipo de convalidación'
    );

    return;
  }

  if (
    normalizarCliente(
      estado.ticketActual
        .tipoTicket
    ) === 'REEVALUADO' &&
    !datos.tipoReevaluacion
  ) {
    mostrarMensaje(
      'mensajeTicket',
      'Selecciona el Tipo de reevaluación'
    );

    return;
  }

  const boton =
    $('botonGuardarTicket');

  if (boton) {
    boton.disabled =
      true;
  }

  mostrarMensaje(
    'mensajeTicket',
    'Guardando cambios...',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (boton) {
          boton.disabled =
            false;
        }

        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeTicket',
            resultado?.message ||
            'No se pudo guardar el ticket'
          );

          return;
        }

        mostrarMensaje(
          'mensajeTicket',
          resultado.message,
          'ok'
        );

        cargarTickets();

        if (
          estado.sesion?.rol ===
          'ADMIN'
        ) {
          cargarDashboardAdmin();
        }

        setTimeout(
          cerrarModalTicket,
          900
        );
      }
    )
    .withFailureHandler(
      error => {
        if (boton) {
          boton.disabled =
            false;
        }

        mostrarMensaje(
          'mensajeTicket',
          error?.message ||
          'Error al guardar el ticket'
        );
      }
    )
    .guardarTicket(
      estado.token,
      datos
    );
}


function reportarTicketPortalActual() {
  if (
    !estado.ticketActual
  ) {
    return;
  }

  if (
    !window.confirm(
      '¿Confirmas que deseas reportar y liberar este ticket Portal?'
    )
  ) {
    return;
  }

  mostrarMensaje(
    'mensajeTicket',
    'Reportando ticket Portal...',
    'ok'
  );

  google.script.run
    .withSuccessHandler(
      resultado => {
        if (
          !resultado ||
          !resultado.ok
        ) {
          mostrarMensaje(
            'mensajeTicket',
            resultado?.message ||
            'No se pudo reportar el ticket Portal'
          );

          return;
        }

        mostrarMensaje(
          'mensajeTicket',
          resultado.message,
          'ok'
        );

        cargarTickets();

        setTimeout(
          cerrarModalTicket,
          1000
        );
      }
    )
    .withFailureHandler(
      error => {
        mostrarMensaje(
          'mensajeTicket',
          error?.message ||
          'Error al reportar el ticket Portal'
        );
      }
    )
    .reportarTicketPortal(
      estado.token,
      estado.ticketActual.numero
    );
}

  $('modalUsuarios')
    ?.classList
    .remove('oculto');

  if (
    $('cuerpoUsuarios')
  ) {

      .innerHTML = `

            colspan="6"
            class="cargando-tabla"
          >

          </td>
        </tr>
      `;
  }

  google.script.run
    .withSuccessHandler(

        if (
          !resultado ||
          !resultado.ok
        ) {
          return;
        }

        pintarUsuariosAdmin(
          resultado.usuarios ||
          [],
          resultado.responsables ||
          []
        );
      }
    )
    .withFailureHandler(
      error => {
        mostrarMensaje(
          'mensajeUsuarios',
          error?.message ||
          'Error al cargar usuarios'
        );
      }

function pintarUsuariosAdmin(
  usuarios,
  responsables
) {
  const tbody =
    $('cuerpoUsuarios');

  if (!tbody) {
    return;
  }

  tbody.innerHTML =
    usuarios
      .filter(
        usuario =>
          usuario.rol !==
          'ADMIN'
      )
      .map(
        usuario => `
          <tr>
            <td>
              ${escapeHtml(usuario.usuario)}
            </td>

            <td>
              <select
                id="resp_${escapeHtml(usuario.usuario)}"
                class="campo"
              >
                <option value="">
                  Sin asignar
                </option>

                ${responsables
                  .map(
                    responsable => `
                      <option
                        value="${escapeHtml(responsable)}"
                        ${
                          responsable ===
                          usuario.responsableAsignado
                            ? 'selected'
                            : ''
                        }
                      >
                        ${escapeHtml(responsable)}
                      </option>
                    `
                  )
                  .join('')}
              </select>
            </td>

            <td>
              <select
                id="activo_${escapeHtml(usuario.usuario)}"
                class="campo"
              >
                <option
                  value="SI"
                  ${usuario.activo === 'SI' ? 'selected' : ''}
                >
                  SI
                </option>

                <option
                  value="NO"
                  ${usuario.activo === 'NO' ? 'selected' : ''}
                >
                  NO
                </option>
              </select>
            </td>

            <td>
              ${escapeHtml(usuario.ultimoIngreso || '-')}
            </td>

            <td>
              ${escapeHtml(usuario.cambiarClave || 'NO')}
            </td>

            <td>
              <button
                class="boton boton-secundario"
                type="button"
                onclick="guardarUsuarioAdminCliente('${escapeHtml(usuario.usuario)}')"
              >
                Guardar
              </button>
            </td>
          </tr>
        `
      )
      .join('');
}


function guardarUsuarioAdminCliente(
  usuario
) {
  google.script.run
    .withSuccessHandler(
      resultado => {
        mostrarMensaje(
          'mensajeUsuarios',
          resultado?.message ||
          'Usuario actualizado',
          resultado?.ok
            ? 'ok'
            : 'error'
        );

        if (
          resultado?.ok
        ) {
          abrirModalUsuarios();
        }
      }
    )
    .guardarUsuarioAdmin(
      estado.token,
      {
        usuario,

        responsableAsignado:
          $(`resp_${usuario}`)
            ?.value ||
          '',

        activo:
          $(`activo_${usuario}`)
            ?.value ||
          'SI'
      }
    );
}


function cerrarModalUsuarios() {
  $('modalUsuarios')
    ?.classList
    .add('oculto');
}


function abrirModalClave(
  forzado = false
) {
  $('modalClave')
    ?.classList
    .remove('oculto');

  $('modalClave')
    .dataset
    .forzado =
    forzado
      ? 'SI'
      : 'NO';
}


function cerrarModalClave() {
  if (
    $('modalClave')
      ?.dataset
      .forzado === 'SI'
  ) {
    return;
  }

  $('modalClave')
    ?.classList
    .add('oculto');
}


function guardarNuevaClave() {
  google.script.run
    .withSuccessHandler(
      resultado => {
        mostrarMensaje(
          'mensajeClave',
          resultado?.message ||
          'Clave actualizada',
          resultado?.ok
            ? 'ok'
            : 'error'
        );

        if (
          resultado?.ok
        ) {
          $('modalClave')
            .dataset
            .forzado =
            'NO';

          setTimeout(
            cerrarModalClave,
            900
          );
        }
      }
    )
    .cambiarMiClave(
      estado.token,
      {
        claveActual:
          $('claveActual')
            ?.value ||
          '',

        nuevaClave:
          $('nuevaClave')
            ?.value ||
          '',

        confirmarClave:
          $('confirmarClave')
            ?.value ||
          ''
      }
    );
}

function cerrarSesion() {
  google.script.run
    .withSuccessHandler(
      () => {
        sessionStorage
          .removeItem(
            'ticketToken'
          );

        location.reload();
      }
    )
    .withFailureHandler(
      () => {
        location.reload();
      }
    )
    .cerrarSesion(
      estado.token
    );
}


function registrarEvento(
  id,
  evento,
  funcion
) {
  $(id)
    ?.addEventListener(
      evento,
      funcion
    );
}


function inicializarAplicacion() {
  registrarEvento(
    'botonIngresar',
    'click',
    ingresar
  );

  registrarEvento(
    'clave',
    'keydown',
    evento => {
      if (
        evento.key ===
        'Enter'
      ) {
        ingresar();
      }
    }
  );

  registrarEvento(
    'botonSalir',
    'click',
    cerrarSesion
  );

  registrarEvento(
    'botonDashboardAdmin',
    'click',
    () => {
      cambiarVista(
        'dashboard'
      );
    }
  );

  registrarEvento(
    'botonBandeja',
    'click',
    () => {
      cambiarVista(
        'bandeja'
      );

      cargarTickets();
    }
  );

  registrarEvento(
    'botonActualizar',
    'click',
    () => {
      if (
        estado.vistaActual ===
        'dashboard'
      ) {
        cargarDashboardAdmin();

      } else {
        cargarListas();
      }
    }
  );

  registrarEvento(

  registrarEvento(
    'botonLimpiarFiltros',
    'click',
    limpiarFiltros

      );
    }
  );

  registrarEvento(

    'keydown',

        evento.key ===
        'Enter'

        cargarTickets();
      }
    }
  );

  registrarEvento(

    'click',
    abrirModalUsuarios

    }

        estado.diarioDashboard

    }
  );

  registrarEvento(
    'ordenAtencionDiaria',
    'change',

      pintarAtencionDiariaOrdenable(
        estado.diarioDashboard
      );
    }
  );

  registrarEvento(
    'dashAsesor',
    'change',
    cargarDashboardAdmin
  );

  registrarEvento(
    'botonNotificarTodosDatos',
    'click',
    notificarTodosDatos
  );

  registrarEvento(
    'botonToggleAlertasDatos',

    alternarAlertasDatos

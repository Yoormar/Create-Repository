<style>
/* =========================================================
   SISTEMA V11 UI CENTRAL
   Un solo controlador para dashboard + DYNAMIC + automático.
========================================================= */

.v11-auto-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 132px;
  min-height: 42px;
  padding: 5px 9px;
  border: 1px solid #bbf7d0;
  border-radius: 9px;
  background: #f0fdf4;
  box-sizing: border-box;
}

.v11-auto-box.procesando {
  border-color: #bfdbfe;
  background: #eff6ff;
}

.v11-auto-box.error {
  border-color: #fecaca;
  background: #fef2f2;
}

.v11-auto-titulo {
  color: #166534;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .04em;
}

#v11ContadorAuto {
  color: #111827;
  font-size: 15px;
  line-height: 1.1;
  font-weight: 900;
}

#v11PendientesAuto {
  color: #667085;
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
}

#v11BotonAsignarAhora {
  border-color: #111827;
  background: #111827;
  color: #fff;
}

#v11BotonAsignarAhora:disabled {
  opacity: .55;
  cursor: wait;
}

.v11-kpi-dynamic {
  border-color: #8b5cf6 !important;
  background: #f5f3ff !important;
}

.v11-barra-dynamic {
  background: #8b5cf6 !important;
}

.origen-dynamic {
  background: #ede9fe !important;
  color: #5b21b6 !important;
}

.v11-toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 99999;
  max-width: 360px;
  padding: 13px 16px;
  border-radius: 12px;
  background: #111827;
  color: #fff;
  box-shadow: 0 14px 30px rgba(15,23,42,.25);
  font-size: 13px;
  font-weight: 700;
}
</style>

<script>
(function () {
  'use strict';

  if (window.__SISTEMA_V11_CENTRAL__) {
    return;
  }

  window.__SISTEMA_V11_CENTRAL__ = true;

  const CICLO_AUTO_MS = 60 * 1000;
  const AVISO_MS = 15 * 1000;

  let procesandoAsignacion = false;
  let proximoCiclo = Date.now() + CICLO_AUTO_MS;
  let ultimoAvisoMs = Date.now();
  let audioContexto = null;
  let triggerVerificado = false;
  let solicitudDashboard = 0;

  function v11(id) {
    return document.getElementById(id);
  }

  function esAdminV11() {
    return String(
      estado?.sesion?.rol || ''
    ).toUpperCase() === 'ADMIN';
  }

  function asegurarDynamicUI() {
    const selector = v11('dashPlataforma');

    if (
      selector &&
      !Array.from(selector.options)
        .some(opcion => opcion.value === 'DYNAMIC')
    ) {
      const opcion = document.createElement('option');
      opcion.value = 'DYNAMIC';
      opcion.textContent = 'Dynamic';
      selector.appendChild(opcion);
    }

    if (!v11('dashAtendidosDynamic')) {
      const portal =
        v11('dashAtendidosPortal')
          ?.closest('article');

      if (portal) {
        const tarjeta = document.createElement('article');
        tarjeta.className =
          'tarjeta tarjeta-kpi v11-kpi-dynamic';
        tarjeta.innerHTML = `
          <span>Atendidos Dynamic</span>
          <strong id="dashAtendidosDynamic">0</strong>
        `;
        portal.insertAdjacentElement('afterend', tarjeta);
      }
    }

    if (!v11('dashAsesorDynamic')) {
      const portalBarra =
        v11('barraAsesorPortal')
          ?.closest('.barra-item');

      if (portalBarra) {
        const bloque = document.createElement('div');
        bloque.className = 'barra-item';
        bloque.innerHTML = `
          <div class="barra-etiqueta">
            <span>Dynamic</span>
            <strong id="dashAsesorDynamic">0</strong>
          </div>
          <div class="barra-fondo">
            <div
              id="barraAsesorDynamic"
              class="barra-valor v11-barra-dynamic"
            ></div>
          </div>
        `;
        portalBarra.insertAdjacentElement('afterend', bloque);
      }
    }

    const filtroOrigen = v11('filtroOrigen');
    if (
      filtroOrigen &&
      !Array.from(filtroOrigen.options)
        .some(opcion => opcion.value === 'DYNAMIC')
    ) {
      const opcion = document.createElement('option');
      opcion.value = 'DYNAMIC';
      opcion.textContent = 'DYNAMIC';
      filtroOrigen.appendChild(opcion);
    }
  }

  function asegurarControlesAuto() {
    const actualizar = v11('botonActualizar');

    if (!actualizar || v11('v11AutoBox')) {
      return;
    }

    const caja = document.createElement('div');
    caja.id = 'v11AutoBox';
    caja.className = 'v11-auto-box oculto';
    caja.innerHTML = `
      <span class="v11-auto-titulo">AUTOMÁTICO</span>
      <strong id="v11ContadorAuto">00:59</strong>
      <small id="v11PendientesAuto">Z 0 · D 0</small>
    `;

    const boton = document.createElement('button');
    boton.id = 'v11BotonAsignarAhora';
    boton.type = 'button';
    boton.className = 'boton boton-secundario oculto';
    boton.textContent = 'Asignar ahora';

    actualizar.insertAdjacentElement('afterend', caja);
    caja.insertAdjacentElement('afterend', boton);

    boton.addEventListener(
      'click',
      () => procesarPendientesUI(true)
    );
  }

  function mostrarControlesAuto() {
    asegurarControlesAuto();

    v11('v11AutoBox')
      ?.classList.toggle('oculto', !esAdminV11());

    v11('v11BotonAsignarAhora')
      ?.classList.toggle('oculto', !esAdminV11());
  }

  function actualizarContador() {
    const contador = v11('v11ContadorAuto');

    if (!contador) {
      return;
    }

    if (procesandoAsignacion) {
      contador.textContent = 'ASIGNANDO';
      return;
    }

    const segundos = Math.max(
      0,
      Math.ceil(
        (proximoCiclo - Date.now()) / 1000
      )
    );

    contador.textContent =
      String(Math.floor(segundos / 60)).padStart(2, '0') +
      ':' +
      String(segundos % 60).padStart(2, '0');
  }

  function consultarPendientes() {
    if (!estado?.token || !esAdminV11()) {
      return;
    }

    google.script.run
      .withSuccessHandler(resultado => {
        if (!resultado?.ok) {
          return;
        }

        const texto = v11('v11PendientesAuto');

        if (texto) {
          texto.textContent =
            `Z ${Number(resultado.zendesk || 0)} · ` +
            `D ${Number(resultado.dynamic || 0)}`;
        }
      })
      .withFailureHandler(() => {})
      .obtenerPendientesAsignacionV11(
        estado.token
      );
  }

  function pintarDynamic(datos) {
    asegurarDynamicUI();

    setText(
      'dashAtendidosDynamic',
      Number(
        datos?.resumenGeneral
          ?.atendidosDynamic || 0
      )
    );

    const plataforma =
      datos?.asesor?.plataforma || {};

    const zendesk =
      Number(plataforma.zendesk || 0);

    const portal =
      Number(plataforma.portal || 0);

    const dynamic =
      Number(plataforma.dynamic || 0);

    setText(
      'dashAsesorDynamic',
      dynamic
    );

    const maximo =
      Math.max(
        zendesk,
        portal,
        dynamic,
        1
      );

    if (v11('barraAsesorZendesk')) {
      v11('barraAsesorZendesk').style.width =
        `${zendesk / maximo * 100}%`;
    }

    if (v11('barraAsesorPortal')) {
      v11('barraAsesorPortal').style.width =
        `${portal / maximo * 100}%`;
    }

    if (v11('barraAsesorDynamic')) {
      v11('barraAsesorDynamic').style.width =
        `${dynamic / maximo * 100}%`;
    }
  }

  function cargarDashboardV11(forzar) {
    if (!esAdminV11()) {
      return;
    }

    asegurarDynamicUI();

    const numeroSolicitud =
      ++solicitudDashboard;

    mostrarMensaje(
      'mensajeDashboard',
      'Actualizando dashboard...',
      'ok'
    );

    google.script.run
      .withSuccessHandler(resultado => {
        if (numeroSolicitud !== solicitudDashboard) {
          return;
        }

        if (!resultado?.ok) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message ||
              'No se pudo cargar el dashboard'
          );
          return;
        }

        estado.dashboard = resultado;

        if (typeof pintarDashboard === 'function') {
          pintarDashboard(resultado);
        }

        pintarDynamic(resultado);
        consultarPendientes();

        mostrarMensaje(
          'mensajeDashboard',
          '',
          'ok'
        );
      })
      .withFailureHandler(error => {
        if (numeroSolicitud !== solicitudDashboard) {
          return;
        }

        mostrarMensaje(
          'mensajeDashboard',
          error?.message ||
            'Error al cargar el dashboard'
        );
      })
      .obtenerDashboardAdminV11(
        estado.token,
        typeof obtenerFiltrosDashboard === 'function'
          ? obtenerFiltrosDashboard()
          : {},
        Boolean(forzar)
      );
  }

  function estadoCaja(texto, clase) {
    const caja = v11('v11AutoBox');

    if (!caja) {
      return;
    }

    caja.classList.remove(
      'procesando',
      'error'
    );

    if (clase) {
      caja.classList.add(clase);
    }

    if (texto) {
      const pendiente = v11('v11PendientesAuto');
      if (pendiente) {
        pendiente.textContent = texto;
      }
    }
  }

  function procesarPendientesUI(manual) {
    if (
      procesandoAsignacion ||
      !estado?.token ||
      !esAdminV11()
    ) {
      return;
    }

    procesandoAsignacion = true;
    estadoCaja(
      'Buscando pendientes...',
      'procesando'
    );
    actualizarContador();

    const boton = v11('v11BotonAsignarAhora');

    if (boton) {
      boton.disabled = true;
      boton.textContent = 'Asignando...';
    }

    google.script.run
      .withSuccessHandler(resultado => {
        procesandoAsignacion = false;
        proximoCiclo =
          Date.now() + CICLO_AUTO_MS;

        if (boton) {
          boton.disabled = false;
          boton.textContent = 'Asignar ahora';
        }

        actualizarContador();

        if (!resultado?.ok) {
          estadoCaja(
            resultado?.message ||
              'Error de asignación',
            'error'
          );

          if (manual) {
            mostrarMensaje(
              'mensajeDashboard',
              resultado?.message ||
                'No se pudo asignar'
            );
          }

          return;
        }

        const asignados =
          Number(
            resultado.totalAsignados || 0
          );

        if (asignados) {
          estadoCaja(
            `${asignados} asignado${asignados === 1 ? '' : 's'}`,
            ''
          );

          if (typeof cargarTickets === 'function') {
            cargarTickets();
          }

          cargarDashboardV11(true);

        } else if (
          Array.isArray(resultado.errores) &&
          resultado.errores.length
        ) {
          estadoCaja(
            resultado.errores[0].message ||
              'No se pudo asignar',
            'error'
          );

        } else {
          estadoCaja(
            'Sin pendientes',
            ''
          );
        }

        if (manual) {
          mostrarMensaje(
            'mensajeDashboard',
            resultado.message ||
              'Proceso finalizado',
            'ok'
          );
        }

        window.setTimeout(
          consultarPendientes,
          700
        );
      })
      .withFailureHandler(error => {
        procesandoAsignacion = false;
        proximoCiclo =
          Date.now() + CICLO_AUTO_MS;

        if (boton) {
          boton.disabled = false;
          boton.textContent = 'Asignar ahora';
        }

        actualizarContador();

        estadoCaja(
          error?.message ||
            'Error al asignar',
          'error'
        );

        if (manual) {
          mostrarMensaje(
            'mensajeDashboard',
            error?.message ||
              'Error al asignar'
          );
        }
      })
      .procesarPendientesV11(
        estado.token
      );
  }

  function asegurarTrigger() {
    if (
      !estado?.token ||
      !esAdminV11() ||
      triggerVerificado
    ) {
      return;
    }

    triggerVerificado = true;

    google.script.run
      .withSuccessHandler(resultado => {
        if (!resultado?.ok) {
          triggerVerificado = false;
          estadoCaja(
            resultado?.message ||
              'Automático no activo',
            'error'
          );
        }
      })
      .withFailureHandler(error => {
        triggerVerificado = false;
        estadoCaja(
          error?.message ||
            'Automático no activo',
          'error'
        );
      })
      .asegurarAsignacionAutomaticaV11(
        estado.token
      );
  }

  function sonarCampana() {
    try {
      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioCtx) {
        return;
      }

      if (!audioContexto) {
        audioContexto =
          new AudioCtx();
      }

      if (
        audioContexto.state ===
        'suspended'
      ) {
        audioContexto
          .resume()
          .catch(() => {});
      }

      const ahora =
        audioContexto.currentTime;

      const gain =
        audioContexto.createGain();

      gain.connect(
        audioContexto.destination
      );

      gain.gain.setValueAtTime(
        0.0001,
        ahora
      );

      gain.gain.exponentialRampToValueAtTime(
        0.18,
        ahora + 0.01
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ahora + 0.9
      );

      [880, 1174.66].forEach(
        (frecuencia, indice) => {
          const osc =
            audioContexto.createOscillator();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(
            frecuencia,
            ahora + indice * 0.08
          );
          osc.connect(gain);
          osc.start(
            ahora + indice * 0.08
          );
          osc.stop(ahora + 0.9);
        }
      );

    } catch (error) {}
  }

  function mostrarToast(notificacion) {
    document
      .querySelector('.v11-toast')
      ?.remove();

    const toast =
      document.createElement('div');

    toast.className = 'v11-toast';
    toast.textContent =
      `Nuevo ticket asignado: ` +
      `${notificacion.origen || ''} · ` +
      `${notificacion.ticket || notificacion.numero || ''}`;

    document.body.appendChild(toast);

    window.setTimeout(
      () => toast.remove(),
      6000
    );
  }

  function consultarAvisos() {
    if (
      !estado?.token ||
      esAdminV11()
    ) {
      return;
    }

    google.script.run
      .withSuccessHandler(resultado => {
        if (!resultado?.ok) {
          return;
        }

        const lista =
          resultado.notificaciones || [];

        lista.forEach(
          notificacion => {
            sonarCampana();
            mostrarToast(notificacion);
          }
        );

        ultimoAvisoMs =
          Number(
            resultado.ahoraMs ||
            Date.now()
          );

        if (
          lista.length &&
          typeof cargarTickets === 'function'
        ) {
          cargarTickets();
        }
      })
      .withFailureHandler(() => {})
      .obtenerNotificacionesAsignacionV11(
        estado.token,
        ultimoAvisoMs
      );
  }

  function habilitarAudio() {
    document.addEventListener(
      'click',
      () => {
        try {
          const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

          if (
            AudioCtx &&
            !audioContexto
          ) {
            audioContexto =
              new AudioCtx();
          }

          if (
            audioContexto?.state ===
            'suspended'
          ) {
            audioContexto
              .resume()
              .catch(() => {});
          }
        } catch (error) {}
      },
      {
        once: true,
        passive: true
      }
    );
  }

  function reemplazarClaseOrigen() {
    if (
      typeof window.claseOrigen !==
      'function'
    ) {
      return;
    }

    const anterior =
      window.claseOrigen;

    window.claseOrigen =
      function (origen) {
        if (
          String(origen || '')
            .trim()
            .toUpperCase() ===
          'DYNAMIC'
        ) {
          return 'origen-dynamic';
        }

        return anterior(origen);
      };
  }

  function instalarControlDashboard() {
    /*
     * Sustituye únicamente el punto de entrada del dashboard.
     * pintarDashboard y el resto de funciones siguen siendo
     * las actuales del Scripts.html.
     */
    window.cargarDashboardAdmin =
      function (forzar) {
        cargarDashboardV11(
          Boolean(forzar)
        );
      };
  }

  function enlazarActualizarSuperior() {
    const boton =
      v11('botonActualizar');

    if (
      !boton ||
      boton.dataset.v11Central === 'SI'
    ) {
      return;
    }

    boton.dataset.v11Central = 'SI';

    boton.addEventListener(
      'click',
      () => {
        if (
          estado?.vistaActual ===
          'dashboard' &&
          esAdminV11()
        ) {
          procesarPendientesUI(false);
        }
      },
      true
    );
  }

  function cicloSesion() {
    asegurarDynamicUI();
    asegurarControlesAuto();
    mostrarControlesAuto();
    enlazarActualizarSuperior();

    if (esAdminV11()) {
      asegurarTrigger();
      consultarPendientes();
    }
  }

  function iniciar() {
    asegurarDynamicUI();
    asegurarControlesAuto();
    reemplazarClaseOrigen();
    instalarControlDashboard();
    enlazarActualizarSuperior();
    habilitarAudio();

    window.setInterval(
      cicloSesion,
      1000
    );

    window.setInterval(
      () => {
        if (esAdminV11()) {
          procesarPendientesUI(false);
        }
      },
      CICLO_AUTO_MS
    );

    window.setInterval(
      actualizarContador,
      1000
    );

    window.setInterval(
      consultarAvisos,
      AVISO_MS
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      iniciar
    );
  } else {
    iniciar();
  }
})();
</script>

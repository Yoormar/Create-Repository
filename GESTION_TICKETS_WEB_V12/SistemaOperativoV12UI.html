<style>
/* =========================================================
   SISTEMA OPERATIVO V12 UI
========================================================= */

.v12-auto-control {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid #bbf7d0;
  border-radius: 9px;
  background: #f0fdf4;
  color: #166534;
  box-sizing: border-box;
  font-size: 11px;
  font-weight: 900;
  white-space: nowrap;
}

.v12-auto-control input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: #16a34a;
  cursor: pointer;
}

.v12-auto-control.v12-activo {
  border-color: #86efac;
  background: #dcfce7;
}

.v12-auto-contador {
  min-width: 36px;
  color: #475569;
  font-size: 10px;
  text-align: center;
}

.v12-chip-pendientes {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 6px 9px;
  border-radius: 999px;
  background: #f8fafc;
  color: #475569;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.v12-auto-procesando {
  opacity: .65;
  pointer-events: none;
}

.v12-version-prioridad {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  margin-left: 7px;
  padding: 4px 8px;
  border-radius: 999px;
  background: #ecfdf3;
  color: #027a48;
  font-size: 9px;
  font-weight: 900;
  white-space: nowrap;
}

.v12-version-prioridad.v12-error {
  background: #fef3f2;
  color: #b42318;
}

.tarjeta-kpi-dynamic {
  border-top-color: #7c3aed !important;
}

.barra-valor-dynamic {
  background: #7c3aed !important;
}

#siguienteAsesorDashboard .asignacion-controles {
  grid-template-columns:
    minmax(280px, 2fr)
    minmax(220px, 1.4fr)
    auto
    auto
    auto
    auto !important;
  align-items: center;
}

@media (max-width: 1250px) {
  #siguienteAsesorDashboard .asignacion-controles {
    grid-template-columns:
      minmax(250px, 2fr)
      minmax(200px, 1.4fr)
      auto
      auto !important;
  }
}

@media (max-width: 760px) {
  #siguienteAsesorDashboard .asignacion-controles {
    grid-template-columns: 1fr !important;
  }
}
</style>

<script>
(function () {
  'use strict';

  if (window.__SISTEMA_OPERATIVO_V12_UI__) {
    return;
  }

  window.__SISTEMA_OPERATIVO_V12_UI__ = true;

  const CLAVE_AUTO = 'GESTION_TICKETS_AUTO_V12';
  const CICLO_MS = 20 * 1000;
  const VERSION_PRIORIDAD_V12 = '12.4';

  let procesando = false;
  let temporizadorAuto = null;
  let temporizadorContador = null;
  let proximaEjecucion = Date.now() + CICLO_MS;
  let ultimaRespuesta = null;

  function v12(id) {
    return document.getElementById(id);
  }

  function esAdminV12() {
    return String(estado?.sesion?.rol || '')
      .trim()
      .toUpperCase() === 'ADMIN';
  }

  function claveAsesorV12(valor) {
    return String(valor || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toUpperCase();
  }

  function filaEsPrioridadV12(fila) {
    return String(fila?.versionPrioridad || '') === VERSION_PRIORIDAD_V12;
  }

  function respuestaEsPrioridadV12(resultado) {
    if (
      String(resultado?.versionPrioridad || '') !== VERSION_PRIORIDAD_V12 ||
      !Array.isArray(resultado?.disponibilidad)
    ) {
      return false;
    }

    return resultado.disponibilidad.every(fila => filaEsPrioridadV12(fila));
  }

  function actualizarEstadoVersionV12(ok, mensaje) {
    const contador = v12('dashCantidadDisponibles');
    if (!contador?.parentElement) return;

    let chip = v12('estadoPrioridadV12');

    if (!chip) {
      chip = document.createElement('span');
      chip.id = 'estadoPrioridadV12';
      chip.className = 'v12-version-prioridad';
      contador.insertAdjacentElement('afterend', chip);
    }

    chip.classList.toggle('v12-error', !ok);
    chip.textContent = ok
      ? `Prioridad V${VERSION_PRIORIDAD_V12}`
      : `Error V${VERSION_PRIORIDAD_V12}`;
    chip.title = mensaje || '';
  }

  function mostrarErrorOperativoV12(mensaje) {
    const texto = mensaje || 'No se pudo cargar la prioridad diaria V12.4';

    actualizarEstadoVersionV12(false, texto);
    console.error('[V12.4]', texto);

    if (typeof mostrarMensaje === 'function') {
      mostrarMensaje('mensajeDashboard', texto, 'error');
    }
  }

  function numeroDiarioV12(asesor) {
    if (!filaEsPrioridadV12(asesor)) {
      return null;
    }

    const valor = Number(asesor?.totalAtencionesHoy ?? 0);

    return Number.isFinite(valor) && valor >= 0
      ? valor
      : 0;
  }

  function reordenarTarjetasV12(filas) {
    const contenedor = v12('listaDisponibilidadAsesores');
    if (!contenedor || !Array.isArray(filas)) return;

    const orden = new Map();

    filas.forEach((fila, indice) => {
      orden.set(claveAsesorV12(fila?.asesor), indice);
    });

    Array.from(contenedor.children)
      .sort((a, b) => {
        const botonA = a.matches?.('.asesor-info')
          ? a
          : a.querySelector?.('.asesor-info');
        const botonB = b.matches?.('.asesor-info')
          ? b
          : b.querySelector?.('.asesor-info');

        const indiceA = orden.get(claveAsesorV12(botonA?.dataset?.asesor));
        const indiceB = orden.get(claveAsesorV12(botonB?.dataset?.asesor));

        return Number(indiceA ?? 9999) - Number(indiceB ?? 9999);
      })
      .forEach(elemento => contenedor.appendChild(elemento));
  }

  /*
   * MUY IMPORTANTE:
   * El dashboard antiguo tambien llama pintarDisponibilidadAsesores.
   * V12.4 solo cambia el texto cuando las filas vienen realmente
   * de obtenerDashboardOperativoV12 y traen versionPrioridad=12.4.
   * Asi evitamos disfrazar acumulados antiguos como "tickets de hoy".
   */
  function instalarPrioridadDiariaUIV12() {
    window.obtenerPrioridadAsesorUI = function (asesor) {
      const valor = numeroDiarioV12(asesor);
      return valor == null
        ? Number(asesor?.prioridad ?? asesor?.asignadosHoy ?? 0)
        : valor;
    };

    const anterior = window.pintarDisponibilidadAsesores;

    if (
      typeof anterior === 'function' &&
      !anterior.__v12Diario
    ) {
      const nuevo = function (filas) {
        const filasV12 =
          Array.isArray(filas) &&
          filas.length > 0 &&
          filas.every(fila => filaEsPrioridadV12(fila));

        const resultado = anterior.apply(this, arguments);

        /*
         * Si la llamada proviene del dashboard antiguo,
         * no tocamos cantidades ni prioridad.
         */
        if (!filasV12) {
          return resultado;
        }

        const porAsesor = new Map();

        filas.forEach(fila => {
          porAsesor.set(claveAsesorV12(fila?.asesor), fila);
        });

        document
          .querySelectorAll('#listaDisponibilidadAsesores .asesor-info')
          .forEach(boton => {
            const fila = porAsesor.get(
              claveAsesorV12(boton.dataset.asesor)
            );
            const detalle = boton.querySelector('small');
            const estadoVisual = boton.querySelector('em');

            if (!fila || !detalle) return;

            const cantidad = numeroDiarioV12(fila);
            if (cantidad == null) return;

            const prioridad = Number(fila.prioridad ?? cantidad);
            const revision = Number(fila.revision || 0);
            const seguimiento = Number(fila.seguimiento || 0);

            detalle.textContent =
              `${cantidad} ticket(s) contabilizado(s) hoy · ` +
              `Prioridad ${prioridad} · ` +
              `${revision} revisión · ` +
              `${seguimiento} seguimiento`;

            if (
              estadoVisual &&
              /^Disponible\b/i.test(estadoVisual.textContent || '')
            ) {
              estadoVisual.textContent =
                `Disponible · Prioridad ${prioridad}`;
            }
          });

        /* Respeta exactamente el orden enviado por V12.4. */
        reordenarTarjetasV12(filas);

        return resultado;
      };

      nuevo.__v12Diario = true;
      window.pintarDisponibilidadAsesores = nuevo;
    }
  }

  function filtrosV12() {
    if (typeof obtenerFiltrosDashboard === 'function') {
      return obtenerFiltrosDashboard();
    }

    return {
      mes: v12('dashMes')?.value || '',
      anio: v12('dashAnio')?.value || '',
      plataforma: v12('dashPlataforma')?.value || '',
      asesor: v12('dashAsesor')?.value || '__GLOBAL__'
    };
  }

  function asegurarDynamicV12() {
    const selector = v12('dashPlataforma');

    if (
      selector &&
      !Array.from(selector.options).some(opcion => opcion.value === 'DYNAMIC')
    ) {
      const opcion = document.createElement('option');
      opcion.value = 'DYNAMIC';
      opcion.textContent = 'Dynamic';
      selector.appendChild(opcion);
    }

    if (!v12('dashAtendidosDynamic')) {
      const portal = v12('dashAtendidosPortal');
      const tarjetaPortal = portal?.closest('.tarjeta-kpi');

      if (tarjetaPortal) {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'tarjeta tarjeta-kpi tarjeta-kpi-dynamic';
        tarjeta.innerHTML = `
          <span>Atendidos Dynamic</span>
          <strong id="dashAtendidosDynamic">0</strong>
        `;
        tarjetaPortal.insertAdjacentElement('afterend', tarjeta);
      }
    }

    if (!v12('dashAsesorDynamic')) {
      const portal = v12('dashAsesorPortal');
      const filaPortal = portal?.closest('.barra-item');

      if (filaPortal) {
        const fila = document.createElement('div');
        fila.className = 'barra-item';
        fila.innerHTML = `
          <div class="barra-etiqueta">
            <span>Dynamic</span>
            <strong id="dashAsesorDynamic">0</strong>
          </div>
          <div class="barra-fondo">
            <div id="barraAsesorDynamic" class="barra-valor barra-valor-dynamic"></div>
          </div>
        `;
        filaPortal.insertAdjacentElement('afterend', fila);
      }
    }

    const cabeceraDiaria = document.querySelector(
      '#vistaDiariaDashboard .tabla-dashboard thead tr'
    );

    if (
      cabeceraDiaria &&
      !cabeceraDiaria.querySelector('[data-v12-dynamic="SI"]')
    ) {
      const th = document.createElement('th');
      th.dataset.v12Dynamic = 'SI';
      th.textContent = 'Atendidos Dynamic';
      cabeceraDiaria.insertBefore(th, cabeceraDiaria.lastElementChild);
    }
  }

  function asegurarAutomaticoV12() {
    const boton = v12('botonProcesarAutomaticos');
    if (!boton) return;

    if (!v12('checkAutomaticoV12')) {
      const etiqueta = document.createElement('label');
      etiqueta.id = 'controlAutomaticoV12';
      etiqueta.className = 'v12-auto-control';
      etiqueta.innerHTML = `
        <input id="checkAutomaticoV12" type="checkbox">
        <span>Automático</span>
        <span id="contadorAutomaticoV12" class="v12-auto-contador">00:20</span>
      `;

      boton.insertAdjacentElement('beforebegin', etiqueta);

      const chip = document.createElement('span');
      chip.id = 'pendientesV12';
      chip.className = 'v12-chip-pendientes';
      chip.textContent = 'Z 0 · D 0';
      etiqueta.insertAdjacentElement('afterend', chip);
    }

    boton.textContent = 'Procesar pendientes';
    boton.title = 'Procesa pendientes Zendesk y Dynamic';

    const check = v12('checkAutomaticoV12');

    if (check && check.dataset.v12Vinculado !== 'SI') {
      check.dataset.v12Vinculado = 'SI';
      check.checked = localStorage.getItem(CLAVE_AUTO) === 'SI';

      check.addEventListener('change', () => {
        localStorage.setItem(CLAVE_AUTO, check.checked ? 'SI' : 'NO');
        configurarAutomaticoV12();
      });
    }

    if (boton.dataset.v12Vinculado !== 'SI') {
      boton.dataset.v12Vinculado = 'SI';

      boton.addEventListener(
        'click',
        evento => {
          evento.preventDefault();
          evento.stopImmediatePropagation();
          procesarPendientesV12UI(true);
        },
        true
      );
    }
  }

  function actualizarContadorV12() {
    const contador = v12('contadorAutomaticoV12');
    if (!contador) return;

    if (procesando) {
      contador.textContent = '...';
      return;
    }

    const check = v12('checkAutomaticoV12');
    if (!check?.checked) {
      contador.textContent = 'OFF';
      return;
    }

    const segundos = Math.max(
      0,
      Math.ceil((proximaEjecucion - Date.now()) / 1000)
    );

    contador.textContent = `00:${String(segundos).padStart(2, '0')}`;
  }

  function configurarAutomaticoV12() {
    const check = v12('checkAutomaticoV12');
    const control = v12('controlAutomaticoV12');
    const botonActualizarDashboard = v12('botonActualizarDashboard');

    window.clearInterval(temporizadorAuto);
    window.clearInterval(temporizadorContador);
    temporizadorAuto = null;
    temporizadorContador = null;

    const activo = Boolean(check?.checked);

    control?.classList.toggle('v12-activo', activo);

    if (botonActualizarDashboard) {
      botonActualizarDashboard.style.display = activo ? 'none' : '';
    }

    if (!activo) {
      actualizarContadorV12();
      return;
    }

    proximaEjecucion = Date.now() + CICLO_MS;
    actualizarContadorV12();

    window.setTimeout(() => procesarPendientesV12UI(false), 250);

    temporizadorAuto = window.setInterval(() => {
      procesarPendientesV12UI(false);
    }, CICLO_MS);

    temporizadorContador = window.setInterval(
      actualizarContadorV12,
      1000
    );
  }

  function pintarDiarioDynamicV12(resultado) {
    asegurarDynamicV12();

    const mapa = {};
    (resultado?.diarioDynamic || []).forEach(item => {
      mapa[String(item.fecha || '')] = Number(item.total || 0);
    });

    document
      .querySelectorAll('#cuerpoVistaDiariaDashboard tr')
      .forEach(fila => {
        const celdas = fila.querySelectorAll('td');
        if (!celdas.length) return;

        const fecha = String(celdas[0].textContent || '').trim();

        let celdaDynamic = fila.querySelector('td[data-v12-dynamic="SI"]');

        if (!celdaDynamic && celdas.length >= 2) {
          celdaDynamic = document.createElement('td');
          celdaDynamic.dataset.v12Dynamic = 'SI';
          fila.insertBefore(celdaDynamic, fila.lastElementChild);
        }

        if (celdaDynamic) {
          celdaDynamic.textContent = String(mapa[fecha] || 0);
        }
      });
  }

  function pintarOperativoV12(resultado) {
    if (!resultado?.ok) {
      mostrarErrorOperativoV12(resultado?.message);
      return;
    }

    if (!respuestaEsPrioridadV12(resultado)) {
      mostrarErrorOperativoV12(
        'La implementación cargada no está devolviendo prioridad V12.4. Revisa que los dos archivos V12 estén en la misma versión.'
      );
      return;
    }

    ultimaRespuesta = resultado;
    actualizarEstadoVersionV12(true, 'Prioridad diaria V12.4 activa');
    asegurarDynamicV12();
    asegurarAutomaticoV12();
    instalarPrioridadDiariaUIV12();

    const resumenGeneral = resultado.resumenGeneral || {};

    if (typeof setText === 'function') {
      setText('dashActivos', Number(resumenGeneral.activos || 0));
      setText('dashAtendidosZendesk', Number(resumenGeneral.atendidosZendesk || 0));
      setText('dashAtendidosPortal', Number(resumenGeneral.atendidosPortal || 0));
      setText('dashAtendidosDynamic', Number(resumenGeneral.atendidosDynamic || 0));
      setText('dashTotalAtendidos', Number(resumenGeneral.totalAtendidos || 0));

      const disponibles = Number(resultado.disponibles || 0);
      setText(
        'dashCantidadDisponibles',
        `${disponibles} disponible${disponibles === 1 ? '' : 's'}`
      );
    }

    const filtrosActuales = filtrosV12();
    const esGlobal =
      !filtrosActuales.asesor ||
      filtrosActuales.asesor === '__GLOBAL__';

    const plataforma = esGlobal
      ? {
          zendesk: Number(resumenGeneral.atendidosZendesk || 0),
          portal: Number(resumenGeneral.atendidosPortal || 0),
          dynamic: Number(resumenGeneral.atendidosDynamic || 0)
        }
      : (resultado.plataformaAsesor || {});

    if (typeof setText === 'function') {
      setText('dashAsesorZendesk', Number(plataforma.zendesk || 0));
      setText('dashAsesorPortal', Number(plataforma.portal || 0));
      setText('dashAsesorDynamic', Number(plataforma.dynamic || 0));
    }

    const maximo = Math.max(
      Number(plataforma.zendesk || 0),
      Number(plataforma.portal || 0),
      Number(plataforma.dynamic || 0),
      1
    );

    const barraZendesk = v12('barraAsesorZendesk');
    const barraPortal = v12('barraAsesorPortal');
    const barraDynamic = v12('barraAsesorDynamic');

    if (barraZendesk) {
      barraZendesk.style.width = `${Number(plataforma.zendesk || 0) / maximo * 100}%`;
    }

    if (barraPortal) {
      barraPortal.style.width = `${Number(plataforma.portal || 0) / maximo * 100}%`;
    }

    if (barraDynamic) {
      barraDynamic.style.width = `${Number(plataforma.dynamic || 0) / maximo * 100}%`;
    }

    if (typeof pintarDisponibilidadAsesores === 'function') {
      pintarDisponibilidadAsesores(resultado.disponibilidad || []);
    }

    if (typeof pintarSiguienteAsesor === 'function') {
      pintarSiguienteAsesor(
        resultado.siguienteAsesor || null,
        resultado.pendientes || [],
        resultado.disponibilidad || []
      );
    }

    estado.pendientesAsignacionZendesk = resultado.pendientes || [];

    const resumen = resultado.pendientesResumen || {};
    const chip = v12('pendientesV12');
    if (chip) {
      chip.textContent = `Z ${Number(resumen.zendesk || 0)} · D ${Number(resumen.dynamic || 0)}`;
    }

    const selectorPendientes = v12('ticketPendienteAsignacion');
    if (selectorPendientes && !(resultado.pendientes || []).length) {
      selectorPendientes.innerHTML = '<option value="">Sin tickets Zendesk/Dynamic pendientes</option>';
    }

    pintarDiarioDynamicV12(resultado);
  }

  function refrescarOperativoV12() {
    if (!estado?.token || !esAdminV12()) return;

    google.script.run
      .withSuccessHandler(resultado => {
        if (!resultado?.ok) {
          mostrarErrorOperativoV12(
            resultado?.message || 'La consulta V12.4 respondió con error'
          );
          return;
        }

        pintarOperativoV12(resultado);
      })
      .withFailureHandler(error => {
        mostrarErrorOperativoV12(
          error?.message || 'No se pudo ejecutar obtenerDashboardOperativoV12'
        );
      })
      .obtenerDashboardOperativoV12(
        estado.token,
        filtrosV12()
      );
  }

  function procesarPendientesV12UI(manual) {
    if (procesando || !estado?.token || !esAdminV12()) return;

    procesando = true;
    const boton = v12('botonProcesarAutomaticos');
    const control = v12('controlAutomaticoV12');

    control?.classList.add('v12-auto-procesando');

    if (boton) {
      boton.disabled = true;
      boton.textContent = 'Asignando...';
    }

    actualizarContadorV12();

    google.script.run
      .withSuccessHandler(resultado => {
        procesando = false;
        proximaEjecucion = Date.now() + CICLO_MS;
        control?.classList.remove('v12-auto-procesando');

        if (boton) {
          boton.disabled = false;
          boton.textContent = 'Procesar pendientes';
        }

        actualizarContadorV12();
        refrescarOperativoV12();

        if (manual && typeof mostrarMensaje === 'function') {
          mostrarMensaje(
            'mensajeDashboard',
            resultado?.message || 'Proceso finalizado',
            resultado?.ok ? 'ok' : 'error'
          );
        }
      })
      .withFailureHandler(error => {
        procesando = false;
        proximaEjecucion = Date.now() + CICLO_MS;
        control?.classList.remove('v12-auto-procesando');

        if (boton) {
          boton.disabled = false;
          boton.textContent = 'Procesar pendientes';
        }

        actualizarContadorV12();

        if (manual && typeof mostrarMensaje === 'function') {
          mostrarMensaje(
            'mensajeDashboard',
            error?.message || 'Error al procesar pendientes'
          );
        }
      })
      .procesarPendientesV12(estado.token);
  }

  function vincularFiltrosV12() {
    ['dashMes', 'dashAnio', 'dashPlataforma', 'dashAsesor']
      .forEach(id => {
        const elemento = v12(id);
        if (!elemento || elemento.dataset.v12Filtro === 'SI') return;

        elemento.dataset.v12Filtro = 'SI';
        elemento.addEventListener('change', () => {
          window.setTimeout(refrescarOperativoV12, 150);
        });
      });
  }

  function vincularDisponibilidadV12() {
    const contenedor = v12('listaDisponibilidadAsesores');
    if (!contenedor || contenedor.dataset.v12Cambio === 'SI') return;

    contenedor.dataset.v12Cambio = 'SI';

    contenedor.addEventListener('change', evento => {
      if (evento.target?.matches('.check-asignacion input')) {
        window.setTimeout(refrescarOperativoV12, 700);
      }
    });
  }

  function envolverPintadoV12() {
    const anterior = window.pintarDashboard;

    if (
      typeof anterior !== 'function' ||
      anterior.__v12Envuelto
    ) {
      return;
    }

    const nuevo = function () {
      const resultado = anterior.apply(this, arguments);
      window.setTimeout(refrescarOperativoV12, 100);
      return resultado;
    };

    nuevo.__v12Envuelto = true;
    window.pintarDashboard = nuevo;
  }

  function iniciarV12() {
    instalarPrioridadDiariaUIV12();
    asegurarDynamicV12();
    asegurarAutomaticoV12();
    vincularFiltrosV12();
    vincularDisponibilidadV12();
    envolverPintadoV12();

    const esperarSesion = window.setInterval(() => {
      if (!estado?.sesion) return;

      instalarPrioridadDiariaUIV12();
      asegurarDynamicV12();
      asegurarAutomaticoV12();
      vincularFiltrosV12();
      vincularDisponibilidadV12();

      if (esAdminV12()) {
        refrescarOperativoV12();
        configurarAutomaticoV12();
      }

      window.clearInterval(esperarSesion);
    }, 500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarV12);
  } else {
    iniciarV12();
  }
})();
</script>

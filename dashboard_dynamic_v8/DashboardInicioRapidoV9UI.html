<style>
/* =========================================================
   DASHBOARD INICIO RAPIDO V9.1 UI
   La estructura se muestra siempre; el dashboard completo
   se actualiza despues, sin bloquear la pantalla.
========================================================= */

#vistaDashboardAdmin.cargando-dashboard-real-ui {
  position: relative !important;
  min-height: 0 !important;
}

#vistaDashboardAdmin.cargando-dashboard-real-ui
> :not(#cargadorDashboardRealUI) {
  display: revert !important;
}

#cargadorDashboardRealUI,
#vistaDashboardAdmin.cargando-dashboard-real-ui
> #cargadorDashboardRealUI {
  display: none !important;
}

.dashboard-inicio-v9-cargando::after {
  content: 'Actualizando datos en segundo plano...';
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 9999;
  padding: 10px 14px;
  border-radius: 10px;
  background: #111111;
  color: #ffffff;
  box-shadow: 0 10px 26px rgba(15,23,42,.22);
  font-size: 12px;
  font-weight: 800;
}
</style>

<script>
(function () {
  'use strict';

  if (window.__DASHBOARD_INICIO_RAPIDO_V91_UI__) {
    return;
  }

  window.__DASHBOARD_INICIO_RAPIDO_V91_UI__ = true;

  let cargandoRapido = false;
  let solicitudRapida = 0;
  let temporizadorCompleto = null;
  let ultimaClave = '';

  function el(id) {
    return document.getElementById(id);
  }

  function filtros() {
    if (typeof obtenerFiltrosDashboard === 'function') {
      return obtenerFiltrosDashboard();
    }

    return {
      mes: el('dashMes')?.value || '',
      anio: el('dashAnio')?.value || '',
      plataforma: el('dashPlataforma')?.value || '',
      asesor: el('dashAsesor')?.value || '__GLOBAL__'
    };
  }

  function claveFiltros() {
    return JSON.stringify(filtros());
  }

  function desbloquearVisual() {
    const panel = el('vistaDashboardAdmin');
    if (!panel) return;

    panel.classList.remove('cargando-dashboard-real-ui');
    panel.classList.remove('dashboard-esperando-ui');
    panel.setAttribute('aria-busy', 'false');

    const cargador = el('cargadorDashboardRealUI');
    if (cargador) {
      cargador.style.display = 'none';
    }
  }

  function pintarRapido(datos) {
    if (!datos || !datos.ok) return;

    const r = datos.resumenGeneral || {};
    const a = datos.asesor || {};
    const estados = a.estados || {};
    const p = a.plataforma || {};

    if (typeof setText === 'function') {
      setText('dashActivos', Number(r.activos || 0));
      setText('dashAtendidosZendesk', Number(r.atendidosZendesk || 0));
      setText('dashAtendidosPortal', Number(r.atendidosPortal || 0));
      setText('dashAtendidosDynamic', Number(r.atendidosDynamic || 0));
      setText('dashTotalAtendidos', Number(r.totalAtendidos || 0));

      setText('dashNombreAsesor', a.nombre || 'Vista global');
      setText('dashActivosAsesor', Number(a.activos || 0));
      setText('dashAtendidosAsesor', Number(a.atendidos || 0));

      setText('dashEstadoRevision', Number(estados.enRevision || 0));
      setText('dashEstadoPendiente', Number(estados.pendiente || 0));
      setText('dashEstadoEspera', Number(estados.enEspera || 0));
      setText('dashEstadoSeguimiento', Number(estados.seguimiento || 0));
      setText('dashEstadoDerivado', Number(estados.derivado || 0));
      setText('dashEstadoAtendido', Number(estados.atendido || 0));

      setText('dashAsesorZendesk', Number(p.zendesk || 0));
      setText('dashAsesorPortal', Number(p.portal || 0));
      setText('dashAsesorDynamic', Number(p.dynamic || 0));
    }

    const maximo = Math.max(
      Number(p.zendesk || 0),
      Number(p.portal || 0),
      Number(p.dynamic || 0),
      1
    );

    const barraZ = el('barraAsesorZendesk');
    const barraP = el('barraAsesorPortal');
    const barraD = el('barraAsesorDynamic');

    if (barraZ) barraZ.style.width = `${Number(p.zendesk || 0) / maximo * 100}%`;
    if (barraP) barraP.style.width = `${Number(p.portal || 0) / maximo * 100}%`;
    if (barraD) barraD.style.width = `${Number(p.dynamic || 0) / maximo * 100}%`;

    desbloquearVisual();
  }

  function programarCompleto() {
    window.clearTimeout(temporizadorCompleto);

    temporizadorCompleto = window.setTimeout(() => {
      if (
        estado?.sesion?.rol !== 'ADMIN' ||
        estado?.vistaActual !== 'dashboard'
      ) {
        return;
      }

      const panel = el('vistaDashboardAdmin');
      panel?.classList.add('dashboard-inicio-v9-cargando');

      if (typeof window.cargarDashboardCompleto === 'function') {
        window.cargarDashboardCompleto();
      }

      window.setTimeout(() => {
        desbloquearVisual();
        panel?.classList.remove('dashboard-inicio-v9-cargando');
      }, 12000);
    }, 900);
  }

  function cargarRapido(forzarCompleto) {
    if (estado?.sesion?.rol !== 'ADMIN') {
      return;
    }

    desbloquearVisual();

    if (forzarCompleto === true) {
      if (typeof window.cargarDashboardCompleto === 'function') {
        window.cargarDashboardCompleto();
        window.setTimeout(desbloquearVisual, 0);
      }
      return;
    }

    const clave = claveFiltros();

    if (cargandoRapido && clave === ultimaClave) {
      return;
    }

    ultimaClave = clave;
    cargandoRapido = true;
    const solicitud = ++solicitudRapida;

    google.script.run
      .withSuccessHandler(resultado => {
        if (solicitud !== solicitudRapida) return;

        cargandoRapido = false;
        pintarRapido(resultado);

        /*
         * Recién después de mostrar los KPI y estados
         * se lanza el dashboard pesado en segundo plano.
         */
        programarCompleto();
      })
      .withFailureHandler(() => {
        if (solicitud !== solicitudRapida) return;

        cargandoRapido = false;
        desbloquearVisual();

        /* Si la rápida falla, conserva como respaldo la carga completa. */
        programarCompleto();
      })
      .obtenerDashboardInicioRapidoV9(
        estado.token,
        filtros()
      );
  }

  function instalarCargaPrincipal() {
    /*
     * IMPORTANTE:
     * Ya NO se ejecuta la función pesada anterior aquí.
     * Las llamadas normales pasan primero por el servicio rápido.
     */
    const nueva = function (forzarCompleto) {
      return cargarRapido(forzarCompleto === true);
    };

    nueva.__inicioRapidoV91 = true;
    window.cargarDashboardAdmin = nueva;
  }

  function observarPanel() {
    const panel = el('vistaDashboardAdmin');
    if (!panel) return;

    desbloquearVisual();

    const observer = new MutationObserver(() => {
      desbloquearVisual();
    });

    observer.observe(panel, {
      attributes: true,
      attributeFilter: ['class', 'aria-busy']
    });
  }

  function iniciar() {
    observarPanel();
    instalarCargaPrincipal();

    window.setTimeout(() => {
      if (
        estado?.sesion?.rol === 'ADMIN' &&
        estado?.vistaActual === 'dashboard'
      ) {
        cargarRapido(false);
      }
    }, 50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>

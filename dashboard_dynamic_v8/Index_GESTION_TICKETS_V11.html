  <!--
    IMPORTANTE:
    NO se incluyen aquí:
    - AjusteCargaDashboardUI
    - DashboardInicioRapidoV9UI
    - AsignacionAutomaticaV10UI
    porque esas tres capas estaban compitiendo por las mismas funciones.
  -->

  <script>
  (function () {
    'use strict';

    const CICLO_MS = 60 * 1000;
    const AVISO_MS = 15 * 1000;

    let procesando = false;
    let proximoCiclo = Date.now() + CICLO_MS;
    let ultimoAvisoMs = Date.now();
    let audioContexto = null;
    let automaticoPreparado = false;

    function v11(id) {
      return document.getElementById(id);
    }

    function esAdminV11() {
      return String(estado?.sesion?.rol || '').toUpperCase() === 'ADMIN';
    }

    function mostrarControlesAdminV11() {
      const caja = v11('autoAsignacionV11');
      const boton = v11('botonAsignarAhoraV11');

      if (!caja || !boton) return;

      caja.classList.toggle('oculto', !esAdminV11());
      boton.classList.toggle('oculto', !esAdminV11());
    }

    function actualizarContadorV11() {
      const contador = v11('contadorAutoV11');
      if (!contador) return;

      if (procesando) {
        contador.textContent = 'ASIGNANDO';
        return;
      }

      const segundos = Math.max(0, Math.ceil((proximoCiclo - Date.now()) / 1000));
      const min = Math.floor(segundos / 60);
      const seg = segundos % 60;
      contador.textContent = String(min).padStart(2, '0') + ':' + String(seg).padStart(2, '0');
    }

    function consultarPendientesV11() {
      if (!estado?.token || !esAdminV11()) return;

      google.script.run
        .withSuccessHandler(resultado => {
          if (!resultado?.ok) return;

          const texto = v11('pendientesAutoV11');
          if (texto) {
            texto.textContent = `Z ${Number(resultado.zendesk || 0)} · D ${Number(resultado.dynamic || 0)}`;
          }
        })
        .withFailureHandler(() => {})
        .obtenerPendientesDirectoV11(estado.token);
    }

    function refrescarDespuesV11() {
      consultarPendientesV11();

      if (typeof cargarTickets === 'function') {
        cargarTickets();
      }

      if (
        estado?.vistaActual === 'dashboard' &&
        typeof cargarDashboardAdmin === 'function'
      ) {
        cargarDashboardAdmin();
      }
    }

    function procesarV11(manual) {
      if (procesando || !estado?.token || !esAdminV11()) {
        return;
      }

      procesando = true;
      actualizarContadorV11();

      const boton = v11('botonAsignarAhoraV11');
      if (boton) {
        boton.disabled = true;
        boton.textContent = 'Asignando...';
      }

      google.script.run
        .withSuccessHandler(resultado => {
          procesando = false;
          proximoCiclo = Date.now() + CICLO_MS;

          if (boton) {
            boton.disabled = false;
            boton.textContent = 'Asignar ahora';
          }

          actualizarContadorV11();
          consultarPendientesV11();

          if (manual && typeof mostrarMensaje === 'function') {
            mostrarMensaje(
              'mensajeDashboard',
              resultado?.message || 'Proceso terminado',
              resultado?.ok ? 'ok' : 'error'
            );
          }

          if (resultado?.ok && Number(resultado.totalAsignados || 0) > 0) {
            refrescarDespuesV11();
          }
        })
        .withFailureHandler(error => {
          procesando = false;
          proximoCiclo = Date.now() + CICLO_MS;

          if (boton) {
            boton.disabled = false;
            boton.textContent = 'Asignar ahora';
          }

          actualizarContadorV11();

          if (typeof mostrarMensaje === 'function') {
            mostrarMensaje(
              'mensajeDashboard',
              error?.message || 'Error al asignar'
            );
          }
        })
        .procesarPendientesDirectoV11(estado.token);
    }

    function asegurarAutomaticoServidorV11() {
      if (!estado?.token || !esAdminV11() || automaticoPreparado) return;

      automaticoPreparado = true;

      google.script.run
        .withSuccessHandler(() => {})
        .withFailureHandler(() => {
          automaticoPreparado = false;
        })
        .asegurarAsignacionDirectaV11(estado.token);
    }

    function sonarCampanaV11() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!audioContexto) {
          audioContexto = new AudioCtx();
        }

        if (audioContexto.state === 'suspended') {
          audioContexto.resume().catch(() => {});
        }

        const ahora = audioContexto.currentTime;
        const gain = audioContexto.createGain();
        gain.connect(audioContexto.destination);
        gain.gain.setValueAtTime(0.0001, ahora);
        gain.gain.exponentialRampToValueAtTime(0.18, ahora + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.9);

        [880, 1174.66].forEach((frecuencia, indice) => {
          const osc = audioContexto.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(frecuencia, ahora + indice * 0.08);
          osc.connect(gain);
          osc.start(ahora + indice * 0.08);
          osc.stop(ahora + 0.9);
        });
      } catch (error) {}
    }

    function mostrarToastV11(notificacion) {
      document.querySelector('.toast-asignacion-v11')?.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-asignacion-v11';
      toast.textContent = `Nuevo ticket asignado: ${notificacion.origen || ''} · ${notificacion.ticket || notificacion.numero || ''}`;
      document.body.appendChild(toast);
      window.setTimeout(() => toast.remove(), 6000);
    }

    function consultarAvisosV11() {
      if (!estado?.token || esAdminV11()) return;

      google.script.run
        .withSuccessHandler(resultado => {
          if (!resultado?.ok) return;

          (resultado.notificaciones || []).forEach(notificacion => {
            sonarCampanaV11();
            mostrarToastV11(notificacion);
          });

          ultimoAvisoMs = Number(resultado.ahoraMs || Date.now());

          if ((resultado.notificaciones || []).length && typeof cargarTickets === 'function') {
            cargarTickets();
          }
        })
        .withFailureHandler(() => {})
        .obtenerNotificacionesAsignacionV11(
          estado.token,
          ultimoAvisoMs
        );
    }

    function habilitarAudioV11() {
      const activar = () => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx && !audioContexto) {
            audioContexto = new AudioCtx();
          }
          if (audioContexto?.state === 'suspended') {
            audioContexto.resume().catch(() => {});
          }
        } catch (error) {}
      };

      document.addEventListener('click', activar, { once: true, passive: true });
    }

    function vincularBotonesV11() {
      const asignar = v11('botonAsignarAhoraV11');
      if (asignar && asignar.dataset.v11 !== 'SI') {
        asignar.dataset.v11 = 'SI';
        asignar.addEventListener('click', () => procesarV11(true));
      }

      ['botonActualizar', 'botonActualizarDashboard'].forEach(id => {
        const boton = v11(id);
        if (!boton || boton.dataset.v11 === 'SI') return;

        boton.dataset.v11 = 'SI';
        boton.addEventListener(
          'click',
          () => {
            if (estado?.vistaActual === 'dashboard' && esAdminV11()) {
              procesarV11(false);
            }
          },
          true
        );
      });
    }

    function cicloSesionV11() {
      mostrarControlesAdminV11();
      vincularBotonesV11();

      if (esAdminV11()) {
        asegurarAutomaticoServidorV11();
        consultarPendientesV11();
      }
    }

    habilitarAudioV11();
    vincularBotonesV11();

    window.setInterval(() => {
      cicloSesionV11();
    }, 1000);

    window.setInterval(() => {
      if (esAdminV11()) {
        procesarV11(false);
      }
    }, CICLO_MS);

    window.setInterval(actualizarContadorV11, 1000);
    window.setInterval(consultarAvisosV11, AVISO_MS);
  })();
  </script>
</body>
</html>
